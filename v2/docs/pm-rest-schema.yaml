          - `PERIODIC` 每小时收的利息
          - `ON_BORROW` 借款的时候第一次收的利息
          - `PERIODIC_CONVERTED` 每小时收的利息，用BNB抵扣
          - `ON_BORROW_CONVERTED` 借款的时候第一次收的利息，用BNB抵扣
