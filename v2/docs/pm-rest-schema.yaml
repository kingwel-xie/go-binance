                          format: int64
                          description: Tx ID.
                        interestAccuredTime:
                          type: integer
                          example: 1672160400000
                          format: int64
                          description: Interest Accured Time.
                        asset:
                          type: string
                          example: USDT
                          description: 资产
                        rawAsset:
                          type: string
                          example: USDT
                          description: Raw Asset.
                        principal:
                          type: string
                          example: '45.3313'
                          description: 支付的本金
                        interest:
                          type: string
                          example: '0.00024995'
                          description: 支付的利息
                        interestRate:
                          type: string
                          example: '0.00013233'
                          description: 日利率
                        type:
                          type: string
                          example: ON_BORROW
                          description: 条件单触发后普通订单类型
                    description: Rows.
                  total:
                    type: integer
                    example: 1
                    format: int64
                    description: Total.
