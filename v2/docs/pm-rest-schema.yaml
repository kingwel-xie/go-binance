        - `TRAILING_STOP_MARKET` 跟踪止损单如果遇到报错 `{"code": -2021, "msg": "Order would immediately trigger."}` 表示订单不满足以下条件:
        - 买入: 指定的`activationPrice` 必须小于 latest mark price
        - 卖出: 指定的`activationPrice` 必须大于 latest mark price
        - 条件单的触发必须:
