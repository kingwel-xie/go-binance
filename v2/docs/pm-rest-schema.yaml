    post:
      summary: UM条件单下单 (TRADE)
      description: UM条件单下单
      tags:
        - trade
      operationId: newUmAlgoOrder
      externalDocs:
        url: https://developers.binance.com/en/docs/catalog/advanced-trading-derivatives-trading-portfolio-margin/api/rest-api/trade#new-um-algo-order
      x-connectors-examples:
        ts: https://raw.githubusercontent.com/binance/binance-connector-js/master/clients/derivatives-trading-portfolio-margin/examples/rest-api/TradeApi/newUmAlgoOrder.ts
        rust: https://raw.githubusercontent.com/binance/binance-connector-rust/main/examples/derivatives_trading_portfolio_margin/rest_api/trade_api/new_um_algo_order.rs
        python: https://raw.githubusercontent.com/binance/binance-connector-python/master/clients/derivatives_trading_portfolio_margin/examples/rest_api/Trade/new_um_algo_order.py
        java: https://raw.githubusercontent.com/binance/binance-connector-java/master/examples/derivatives-trading-portfolio-margin/src/main/java/com/binance/connector/client/derivatives_trading_portfolio_margin/rest/trade/NewUmAlgoOrderExample.java
        go: https://raw.githubusercontent.com/binance/binance-connector-go/main/clients/derivativestradingportfoliomargin/examples/restapi/TradeAPI/NewUmAlgoOrder/NewUmAlgoOrder.go
        php: https://raw.githubusercontent.com/binance/binance-connector-php/master/examples/derivatives-trading-portfolio-margin/trade/NewUmAlgoOrderExample.php
      x-ip-weight: 1
      x-security-type: TRADE
      x-signed: true
      parameters:
        - name: X-MBX-APIKEY
          in: header
          required: true
          description: 访问此接口需要 API Key，并且必须在请求头中携带。关于如何创建 API Key，请参考：[https://www.binance.com/cn/support/faq/detail/360002502072](https://www.binance.com/cn/support/faq/detail/360002502072)。
          schema:
            type: string
            example: API_KEY
      x-parameters-notes: |-
        - 类型为 `STOP` 的条件订单可以传入参数 `timeInForce`（默认值为 `GTC`）。
        - 类型为 `TAKE_PROFIT` 的条件订单可以传入参数 `timeInForce`（默认值为 `GTC`）。
        - 条件单的触发必须满足对应价格条件。
        - `STOP`, `STOP_MARKET` 止损单: 买入: 最新价格 >= 触发价; 卖出: 最新价格 <= 触发价。
        - `TAKE_PROFIT`, `TAKE_PROFIT_MARKET` 止盈单: 买入: 最新价格 <= 触发价; 卖出: 最新价格 >= 触发价。
        - `TRAILING_STOP_MARKET` 跟踪止损单: 买入: 最低价 <= 激活价格，且最新价格 >= 最低价 * (1 + 回调比例); 卖出: 最高价 >= 激活价格，且最新价格 <= 最高价 * (1 - 回调比例)。
        - `STOP_MARKET`, `TAKE_PROFIT_MARKET` 配合 `closePosition`=`true`: 条件单触发依照上述条件单触发逻辑；条件触发后，平掉当时持有所有多头仓位(若为卖单)或当时持有所有空头仓位(若为买单)；不支持 `quantity` 参数；自带只平仓属性，不支持 `reduceOnly` 参数；双开模式下,`LONG`方向上不支持`BUY`; `SHORT` 方向上不支持`SELL`。
        - `selfTradePreventionMode` 仅在 `timeInForce` 为 `IOC` 或 `GTC` 或 `GTD` 时生效。
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - algoType
                - symbol
                - side
                - type
                - timestamp
              properties:
                algoType:
                  type: string
                  example: CONDITIONAL
                  enum:
                    - CONDITIONAL
                  description: 仅支持 `CONDITIONAL`
                symbol:
                  type: string
                  example: BNBUSDT
                side:
                  type: string
                  example: SELL
                  enum:
                    - BUY
                    - SELL
                positionSide:
                  type: string
                  example: BOTH
                  enum:
                    - BOTH
                    - LONG
                    - SHORT
                  description: 单向持仓模式下默认且仅可填`BOTH`；双向持仓模式下必填，仅可选择 `LONG` 或 `SHORT`
                type:
                  type: string
                  example: TAKE_PROFIT
                  enum:
                    - STOP
                    - TAKE_PROFIT
                    - STOP_MARKET
                    - TAKE_PROFIT_MARKET
                    - TRAILING_STOP_MARKET
                  description: 条件订单类型
                timeInForce:
                  type: string
                  example: GTC
                  enum:
                    - IOC
                    - GTC
                    - FOK
                    - GTX
                    - GTD
                  default: GTC
                quantity:
                  type: number
                  format: float
                  example: '0.01'
                  description: 下单数量,使用`closePosition`不支持此参数。
                price:
                  type: number
                  format: float
                  example: '750.000'
                  description: 委托价格
                triggerPrice:
                  type: number
                  format: float
                  example: '750.000'
                  description: 触发价
                workingType:
                  type: string
                  example: CONTRACT_PRICE
                  enum:
                    - MARK_PRICE
                    - CONTRACT_PRICE
                  default: CONTRACT_PRICE
                  description: 触发类型，默认 `CONTRACT_PRICE`
                priceMatch:
                  type: string
                  example: NONE
                  enum:
                    - OPPONENT
                    - OPPONENT_5
                    - OPPONENT_10
                    - OPPONENT_20
                    - QUEUE
                    - QUEUE_5
                    - QUEUE_10
                    - QUEUE_20
                  description: 不能与 `price` 同时传
                closePosition:
                  type: string
                  example: 'true'
                  enum:
                    - 'true'
                    - 'false'
                  description: 触发后全部平仓，仅支持`STOP_MARKET`和`TAKE_PROFIT_MARKET`；不与`quantity`合用；自带只平仓效果，不与`reduceOnly` 合用
                priceProtect:
                  type: string
                  example: 'false'
                  enum:
                    - 'true'
                    - 'false'
                  default: 'false'
                  description: 条件单触发保护，默认 `false`
                reduceOnly:
                  type: string
                  example: 'false'
                  enum:
                    - 'true'
                    - 'false'
                  default: 'false'
                  description: 非双开模式下默认`false`；双开模式下不接受此参数； 使用`closePosition`不支持此参数。
                activatePrice:
                  type: number
                  format: float
                  example: 700
                  description: 追踪止损激活价格，仅`TRAILING_STOP_MARKET`需要
                callbackRate:
                  type: number
                  format: float
                  example: 1
                  description: 追踪止损回调比例，范围[0.1, 10]，1代表1%
                clientAlgoId:
                  type: string
                  example: 6B2I9XVcJpCjqPAJ4YoFX7
                  description: 用户自定义的条件订单号，不可以重复出现在挂单中
                newOrderRespType:
                  type: string
                  example: ACK
                  enum:
                    - ACK
                    - RESULT
                  default: ACK
                selfTradePreventionMode:
                  type: string
                  example: NONE
                  enum:
                    - NONE
                    - EXPIRE_TAKER
                    - EXPIRE_MAKER
                    - EXPIRE_BOTH
                  default: NONE
                goodTillDate:
                  type: integer
                  format: int64
                  example: 0
                  description: TIF为GTD时订单的自动取消时间，当timeInForce为GTD时必传
                recvWindow:
                  type: integer
                  format: int64
                  maximum: 60000
                  example: 5000
                timestamp:
                  type: integer
                  example: 1770736694138
                  format: int64
                  description: 用于请求签名的 Unix 时间戳，单位为毫秒. 该值必须反映客户端当前时间，并会在签名接口中由服务器进行校验.
      responses:
        '200':
          description: UM条件单下单
          content:
            application/json:
              schema:
                type: object
                properties:
                  algoId:
                    type: integer
                    example: 2146760
                    format: int64
                  clientAlgoId:
                    type: string
                    example: 6B2I9XVcJpCjqPAJ4YoFX7
                  algoType:
                    type: string
                    example: CONDITIONAL
                  orderType:
                    type: string
                    example: TAKE_PROFIT
                  symbol:
                    type: string
                    example: BNBUSDT
                  side:
                    type: string
                    example: SELL
                  positionSide:
                    type: string
                    example: BOTH
                  timeInForce:
                    type: string
                    example: GTC
                  quantity:
                    type: string
                    example: '0.01'
                  algoStatus:
                    type: string
                    example: NEW
                  triggerPrice:
                    type: string
                    example: '750.000'
                  price:
                    type: string
                    example: '750.000'
                  selfTradePreventionMode:
                    type: string
                    example: EXPIRE_MAKER
                  workingType:
                    type: string
                    example: CONTRACT_PRICE
                  priceMatch:
                    type: string
                    example: NONE
                  closePosition:
                    type: boolean
                    example: false
                  priceProtect:
                    type: boolean
                    example: false
                  reduceOnly:
                    type: boolean
                    example: false
                  activatePrice:
                    type: string
                    example: ''
                  callbackRate:
                    type: string
                    example: ''
                  createTime:
                    type: integer
                    example: 1750485492076
                    format: int64
                  updateTime:
                    type: integer
                    example: 1750485492076
                    format: int64
                  triggerTime:
                    type: integer
                    example: 0
                    format: int64
                  goodTillDate:
                    type: integer
                    example: 0
                    format: int64
