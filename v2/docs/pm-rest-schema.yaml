                    - CONTRACT_PRICE
                  description: 'stopPrice 触发类型: `MARK_PRICE`, `CONTRACT_PRICE`. 默认 `CONTRACT_PRICE`'
                priceProtect:
                  type: string
                  example: 'true'
                  default: 'false'
                  description: 条件单触发保护："true" or "false", 默认 "false". `STOP`/`STOP_MARKET` or `TAKE_PROFIT`/`TAKE_PROFIT_MARKET` 需要此参数
                  enum:
                    - 'true'
                    - 'false'
                newClientStrategyId:
                  type: string
                  example: '1'
                  description: '用户自定义的订单号，不可以重复出现在挂单中。如空缺系统会自动赋值。必须满足正则规则: `^[\.A-Z\:/a-z0-9_-]{1,32}$`'
                stopPrice:
                  type: number
                  example: '1.0'
                  format: float
                  description: Used 带 `STOP/STOP_MARKET` 或 `TAKE_PROFIT/TAKE_PROFIT_MARKET` 订单.
                activationPrice:
                  type: number
                  example: '1.0'
