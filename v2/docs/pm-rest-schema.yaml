openapi: 3.0.2
info:
  title: Portfolio Margin REST API
  description: 访问账户信息、管理保证金仓位，并通过 Binance 统一账户进行交易。
  version: 1.0.0
  termsOfService: https://www.binance.com/en/terms
  contact:
    name: Binance API Support
    url: https://www.binance.com/en/support
x-product-type: rest-api
x-rate-limits-guide: products/derivatives-trading-portfolio-margin/general-info#访问限制
x-security-guide: products/derivatives-trading-portfolio-margin/general-info#接口鉴权类型
x-api-key-guide: https://www.binance.com/cn/support/faq/detail/360002502072
externalDocs:
  description: Portfolio Margin docs
  url: https://developers.binance.com/en/docs/products/derivatives-trading-portfolio-margin/general-info
tags:
  - name: account
    x-displayName: 账户接口
  - name: market-data
    x-displayName: 市场数据
  - name: trade
    x-displayName: 交易接口
  - name: user-data-streams
    x-displayName: Websocket账户信息推送
servers:
  - url: https://papi.binance.com
  - url: https://testnet.binancefuture.com
paths:
  /papi/v1/balance:
    get:
      summary: 查询账户余额 (USER_DATA)
      description: 查询账户余额
      tags:
        - account
      operationId: accountBalance
      externalDocs:
        url: https://developers.binance.com/en/docs/catalog/advanced-trading-derivatives-trading-portfolio-margin/api/rest-api/account#account-balance
      x-connectors-examples:
        ts: https://raw.githubusercontent.com/binance/binance-connector-js/master/clients/derivatives-trading-portfolio-margin/examples/rest-api/AccountApi/accountBalance.ts
        rust: https://raw.githubusercontent.com/binance/binance-connector-rust/main/examples/derivatives_trading_portfolio_margin/rest_api/account_api/account_balance.rs
        python: https://raw.githubusercontent.com/binance/binance-connector-python/master/clients/derivatives_trading_portfolio_margin/examples/rest_api/Account/account_balance.py
        java: https://raw.githubusercontent.com/binance/binance-connector-java/master/examples/derivatives-trading-portfolio-margin/src/main/java/com/binance/connector/client/derivatives_trading_portfolio_margin/rest/account/AccountBalanceExample.java
        go: https://raw.githubusercontent.com/binance/binance-connector-go/main/clients/derivativestradingportfoliomargin/examples/restapi/AccountAPI/AccountBalance/AccountBalance.go
        php: https://raw.githubusercontent.com/binance/binance-connector-php/master/examples/derivatives-trading-portfolio-margin/account/AccountBalanceExample.php
      x-ip-weight: 20
      x-security-type: USER_DATA
      x-signed: true
      parameters:
        - name: X-MBX-APIKEY
          in: header
          required: true
          description: 访问此接口需要 API Key，并且必须在请求头中携带。关于如何创建 API Key，请参考：[https://www.binance.com/cn/support/faq/detail/360002502072](https://www.binance.com/cn/support/faq/detail/360002502072)。
          schema:
            type: string
            example: API_KEY
        - name: asset
          in: query
          required: false
          schema:
            type: string
            example: USDT
        - name: recvWindow
          in: query
          required: false
          schema:
            type: integer
            example: 5000
            format: int64
        - name: timestamp
          in: query
          required: true
          schema:
            type: integer
            example: 1770736694138
            format: int64
          description: 用于请求签名的 Unix 时间戳，单位为毫秒. 该值必须反映客户端当前时间，并会在签名接口中由服务器进行校验.
      responses:
        '200':
          description: 账户 Balance
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      type: object
                      properties:
                        asset:
                          type: string
                          example: USDT
                          description: 资产
                        totalWalletBalance:
                          type: string
                          example: '122607.35137903'
                          description: Total Wallet Balance.
                        crossMarginAsset:
                          type: string
                          example: '92.27530794'
                          description: Cross Margin Asset.
                        crossMarginBorrowed:
                          type: string
                          example: '10.00000000'
                          description: Cross Margin Borrowed.
                        crossMarginFree:
                          type: string
                          example: '100.00000000'
                          description: Cross Margin Free.
                        crossMarginInterest:
                          type: string
                          example: '0.72469206'
                          description: Cross Margin Interest.
                        crossMarginLocked:
                          type: string
                          example: '3.00000000'
                          description: Cross Margin Locked.
                        umWalletBalance:
                          type: string
                          example: '0.00000000'
                          description: Um Wallet Balance.
                        umUnrealizedPNL:
                          type: string
                          example: '23.72469206'
                          description: Um Unrealized PNL.
                        cmWalletBalance:
                          type: string
                          example: '23.72469206'
                          description: Cm Wallet Balance.
                        cmUnrealizedPNL:
                          type: string
                          example: ''
                          description: Cm Unrealized PNL.
                        updateTime:
                          type: integer
                          example: 1617939110373
                          format: int64
                          description: 更新时间
                        negativeBalance:
                          type: string
                          example: '0'
                          description: 当前负余额值
                  - type: object
                    properties:
                      asset:
                        type: string
                        example: USDT
                        description: 资产
                      totalWalletBalance:
                        type: string
                        example: '122607.35137903'
                        description: Total Wallet Balance.
                      crossMarginBorrowed:
                        type: string
                        example: '10.00000000'
                        description: Cross Margin Borrowed.
                      crossMarginFree:
                        type: string
                        example: '100.00000000'
                        description: Cross Margin Free.
                      crossMarginInterest:
                        type: string
                        example: '0.72469206'
                        description: Cross Margin Interest.
                      crossMarginLocked:
                        type: string
                        example: '3.00000000'
                        description: Cross Margin Locked.
                      umWalletBalance:
                        type: string
                        example: '0.00000000'
                        description: Um Wallet Balance.
                      umUnrealizedPNL:
                        type: string
                        example: '23.72469206'
                        description: Um Unrealized PNL.
                      cmWalletBalance:
                        type: string
                        example: '23.72469206'
                        description: Cm Wallet Balance.
                      cmUnrealizedPNL:
                        type: string
                        example: ''
                        description: Cm Unrealized PNL.
                      updateTime:
                        type: integer
                        example: 1617939110373
                        format: int64
                        description: 更新时间
                      negativeBalance:
                        type: string
                        example: '0'
                        description: 当前负余额值
  /papi/v1/account:
    get:
      summary: 查询账户信息 (USER_DATA)
      description: 查询账户信息
      tags:
        - account
      operationId: accountInformation
      externalDocs:
        url: https://developers.binance.com/en/docs/catalog/advanced-trading-derivatives-trading-portfolio-margin/api/rest-api/account#account-information
      x-connectors-examples:
        ts: https://raw.githubusercontent.com/binance/binance-connector-js/master/clients/derivatives-trading-portfolio-margin/examples/rest-api/AccountApi/accountInformation.ts
        rust: https://raw.githubusercontent.com/binance/binance-connector-rust/main/examples/derivatives_trading_portfolio_margin/rest_api/account_api/account_information.rs
        python: https://raw.githubusercontent.com/binance/binance-connector-python/master/clients/derivatives_trading_portfolio_margin/examples/rest_api/Account/account_information.py
        java: https://raw.githubusercontent.com/binance/binance-connector-java/master/examples/derivatives-trading-portfolio-margin/src/main/java/com/binance/connector/client/derivatives_trading_portfolio_margin/rest/account/AccountInformationExample.java
        go: https://raw.githubusercontent.com/binance/binance-connector-go/main/clients/derivativestradingportfoliomargin/examples/restapi/AccountAPI/AccountInformation/AccountInformation.go
        php: https://raw.githubusercontent.com/binance/binance-connector-php/master/examples/derivatives-trading-portfolio-margin/account/AccountInformationExample.php
      x-ip-weight: 20
      x-security-type: USER_DATA
      x-signed: true
      parameters:
        - name: X-MBX-APIKEY
          in: header
          required: true
          description: 访问此接口需要 API Key，并且必须在请求头中携带。关于如何创建 API Key，请参考：[https://www.binance.com/cn/support/faq/detail/360002502072](https://www.binance.com/cn/support/faq/detail/360002502072)。
          schema:
            type: string
            example: API_KEY
        - name: recvWindow
          in: query
          required: false
          schema:
            type: integer
            example: 5000
            format: int64
        - name: timestamp
          in: query
          required: true
          schema:
            type: integer
            example: 1770736694138
            format: int64
          description: 用于请求签名的 Unix 时间戳，单位为毫秒. 该值必须反映客户端当前时间，并会在签名接口中由服务器进行校验.
      responses:
        '200':
          description: 账户 信息
          content:
            application/json:
              schema:
                type: object
                properties:
                  uniMMR:
                    type: string
                    example: '5167.92171923'
                    description: 统一账户维持保证金率
                  accountEquity:
                    type: string
                    example: '73.47428058'
                    description: 以USD计价的账户权益
                  actualEquity:
                    type: string
                    example: '122607.35137903'
                    description: 不考虑质押率的以USD计价账户权益
                  accountInitialMargin:
                    type: string
                    example: '23.72469206'
                    description: Account Initial Margin.
                  accountMaintMargin:
                    type: string
                    example: '23.72469206'
                    description: 以USD计价统一账户维持保证金
                  accountStatus:
                    type: string
                    example: NORMAL
                    description: 统一账户账户状态："NORMAL", "MARGIN_CALL", "SUPPLY_MARGIN", "REDUCE_ONLY", "ACTIVE_LIQUIDATION", "FORCE_LIQUIDATION", "BANKRUPTED"
                  virtualMaxWithdrawAmount:
                    type: string
                    example: '1627523.32459208'
                    description: 以USD计价的最大可转出
                  totalAvailableBalance:
                    type: string
                    example: ''
                    description: Total Available Balance.
                  totalMarginOpenLoss:
                    type: string
                    example: ''
                    description: in USD margin open order
                  updateTime:
                    type: integer
                    example: 1657707212154
                    format: int64
                    description: 更新时间
  /papi/v1/bnb-transfer:
    post:
      summary: BNB划转 (TRADE)
      description: 从PM钱包划转BNB到UM钱包
      tags:
        - account
      operationId: bnbTransfer
      externalDocs:
        url: https://developers.binance.com/en/docs/catalog/advanced-trading-derivatives-trading-portfolio-margin/api/rest-api/account#bnb-transfer
      x-connectors-examples:
        ts: https://raw.githubusercontent.com/binance/binance-connector-js/master/clients/derivatives-trading-portfolio-margin/examples/rest-api/AccountApi/bnbTransfer.ts
        rust: https://raw.githubusercontent.com/binance/binance-connector-rust/main/examples/derivatives_trading_portfolio_margin/rest_api/account_api/bnb_transfer.rs
        python: https://raw.githubusercontent.com/binance/binance-connector-python/master/clients/derivatives_trading_portfolio_margin/examples/rest_api/Account/bnb_transfer.py
        java: https://raw.githubusercontent.com/binance/binance-connector-java/master/examples/derivatives-trading-portfolio-margin/src/main/java/com/binance/connector/client/derivatives_trading_portfolio_margin/rest/account/BnbTransferExample.java
        go: https://raw.githubusercontent.com/binance/binance-connector-go/main/clients/derivativestradingportfoliomargin/examples/restapi/AccountAPI/BnbTransfer/BnbTransfer.go
        php: https://raw.githubusercontent.com/binance/binance-connector-php/master/examples/derivatives-trading-portfolio-margin/account/BnbTransferExample.php
      x-ip-weight: 750
      x-security-type: TRADE
      x-signed: true
      parameters:
        - name: X-MBX-APIKEY
          in: header
          required: true
          description: 访问此接口需要 API Key，并且必须在请求头中携带。关于如何创建 API Key，请参考：[https://www.binance.com/cn/support/faq/detail/360002502072](https://www.binance.com/cn/support/faq/detail/360002502072)。
          schema:
            type: string
            example: API_KEY
      x-parameters-notes: '- 本接口每10分钟只能调用10次（时间滚动计算）'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - amount
                - transferSide
                - timestamp
              properties:
                amount:
                  type: number
                  example: '1.0'
                  format: float
                transferSide:
                  type: string
                  example: TO_UM
                  enum:
                    - TO_UM
                    - FROM_UM
                recvWindow:
                  type: integer
                  example: 5000
                  maximum: 60000
                  format: int64
                timestamp:
                  type: integer
                  example: 1770736694138
                  format: int64
                  description: 用于请求签名的 Unix 时间戳，单位为毫秒. 该值必须反映客户端当前时间，并会在签名接口中由服务器进行校验.
      responses:
        '200':
          description: BNB 划转
          content:
            application/json:
              schema:
                type: object
                properties:
                  tranId:
                    type: integer
                    example: 100000001
                    format: int64
                    description: 交易ID。
  /papi/v1/repay-futures-switch:
    post:
      summary: 更改自动清还合约负余额模式 (TRADE)
      description: 更改自动支付合约负余额模式
      tags:
        - account
      operationId: changeAutoRepayFuturesStatus
      externalDocs:
        url: https://developers.binance.com/en/docs/catalog/advanced-trading-derivatives-trading-portfolio-margin/api/rest-api/account#change-auto-repay-futures-status
      x-connectors-examples:
        ts: https://raw.githubusercontent.com/binance/binance-connector-js/master/clients/derivatives-trading-portfolio-margin/examples/rest-api/AccountApi/changeAutoRepayFuturesStatus.ts
        rust: https://raw.githubusercontent.com/binance/binance-connector-rust/main/examples/derivatives_trading_portfolio_margin/rest_api/account_api/change_auto_repay_futures_status.rs
        python: https://raw.githubusercontent.com/binance/binance-connector-python/master/clients/derivatives_trading_portfolio_margin/examples/rest_api/Account/change_auto_repay_futures_status.py
        java: https://raw.githubusercontent.com/binance/binance-connector-java/master/examples/derivatives-trading-portfolio-margin/src/main/java/com/binance/connector/client/derivatives_trading_portfolio_margin/rest/account/ChangeAutoRepayFuturesStatusExample.java
        go: https://raw.githubusercontent.com/binance/binance-connector-go/main/clients/derivativestradingportfoliomargin/examples/restapi/AccountAPI/ChangeAutoRepayFuturesStatus/ChangeAutoRepayFuturesStatus.go
        php: https://raw.githubusercontent.com/binance/binance-connector-php/master/examples/derivatives-trading-portfolio-margin/account/ChangeAutoRepayFuturesStatusExample.php
      x-ip-weight: 750
      x-security-type: TRADE
      x-signed: true
      parameters:
        - name: X-MBX-APIKEY
          in: header
          required: true
          description: 访问此接口需要 API Key，并且必须在请求头中携带。关于如何创建 API Key，请参考：[https://www.binance.com/cn/support/faq/detail/360002502072](https://www.binance.com/cn/support/faq/detail/360002502072)。
          schema:
            type: string
            example: API_KEY
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - autoRepay
                - timestamp
              properties:
                autoRepay:
                  type: string
                  example: 'true'
                  default: 'true'
                  enum:
                    - 'true'
                    - 'false'
                  description: '`false`代表关闭自动清还合约负余额'
                recvWindow:
                  type: integer
                  example: 5000
                  format: int64
                timestamp:
                  type: integer
                  example: 1770736694138
                  format: int64
                  description: 用于请求签名的 Unix 时间戳，单位为毫秒. 该值必须反映客户端当前时间，并会在签名接口中由服务器进行校验.
      responses:
        '200':
          description: 修改Auto-repay-futures 状态
          content:
            application/json:
              schema:
                type: object
                properties:
                  msg:
                    type: string
                    example: success
                    description: Msg.
    get:
      summary: 查询自动清还合约负余额模式 (USER_DATA)
      description: 查询自动清还合约负余额模式
      tags:
        - account
      operationId: getAutoRepayFuturesStatus
      externalDocs:
        url: https://developers.binance.com/en/docs/catalog/advanced-trading-derivatives-trading-portfolio-margin/api/rest-api/account#get-auto-repay-futures-status
      x-connectors-examples:
        ts: https://raw.githubusercontent.com/binance/binance-connector-js/master/clients/derivatives-trading-portfolio-margin/examples/rest-api/AccountApi/getAutoRepayFuturesStatus.ts
        rust: https://raw.githubusercontent.com/binance/binance-connector-rust/main/examples/derivatives_trading_portfolio_margin/rest_api/account_api/get_auto_repay_futures_status.rs
        python: https://raw.githubusercontent.com/binance/binance-connector-python/master/clients/derivatives_trading_portfolio_margin/examples/rest_api/Account/get_auto_repay_futures_status.py
        java: https://raw.githubusercontent.com/binance/binance-connector-java/master/examples/derivatives-trading-portfolio-margin/src/main/java/com/binance/connector/client/derivatives_trading_portfolio_margin/rest/account/GetAutoRepayFuturesStatusExample.java
        go: https://raw.githubusercontent.com/binance/binance-connector-go/main/clients/derivativestradingportfoliomargin/examples/restapi/AccountAPI/GetAutoRepayFuturesStatus/GetAutoRepayFuturesStatus.go
        php: https://raw.githubusercontent.com/binance/binance-connector-php/master/examples/derivatives-trading-portfolio-margin/account/GetAutoRepayFuturesStatusExample.php
      x-ip-weight: 30
      x-security-type: USER_DATA
      x-signed: true
      parameters:
        - name: X-MBX-APIKEY
          in: header
          required: true
          description: 访问此接口需要 API Key，并且必须在请求头中携带。关于如何创建 API Key，请参考：[https://www.binance.com/cn/support/faq/detail/360002502072](https://www.binance.com/cn/support/faq/detail/360002502072)。
          schema:
            type: string
            example: API_KEY
        - name: recvWindow
          in: query
          required: false
          schema:
            type: integer
            example: 5000
            format: int64
        - name: timestamp
          in: query
          required: true
          schema:
            type: integer
            example: 1770736694138
            format: int64
          description: 用于请求签名的 Unix 时间戳，单位为毫秒. 该值必须反映客户端当前时间，并会在签名接口中由服务器进行校验.
      responses:
        '200':
          description: 获取Auto-repay-futures 状态
          content:
            application/json:
              schema:
                type: object
                properties:
                  autoRepay:
                    type: boolean
                    example: true
                    description: '`true`代表自动清还合约负余额; `false`代表关闭自动清还合约负余额'
  /papi/v1/cm/leverage:
    post:
      summary: 调整CM开仓杠杆 (TRADE)
      description: 调整用户在指定CM symbol合约的开仓杠杆。不同持仓方向上使用相同杠杆倍数，共享允许的最大交易标的资产数量
      tags:
        - account
      operationId: changeCmInitialLeverage
      externalDocs:
        url: https://developers.binance.com/en/docs/catalog/advanced-trading-derivatives-trading-portfolio-margin/api/rest-api/account#change-cm-initial-leverage
      x-connectors-examples:
        ts: https://raw.githubusercontent.com/binance/binance-connector-js/master/clients/derivatives-trading-portfolio-margin/examples/rest-api/AccountApi/changeCmInitialLeverage.ts
        rust: https://raw.githubusercontent.com/binance/binance-connector-rust/main/examples/derivatives_trading_portfolio_margin/rest_api/account_api/change_cm_initial_leverage.rs
        python: https://raw.githubusercontent.com/binance/binance-connector-python/master/clients/derivatives_trading_portfolio_margin/examples/rest_api/Account/change_cm_initial_leverage.py
        java: https://raw.githubusercontent.com/binance/binance-connector-java/master/examples/derivatives-trading-portfolio-margin/src/main/java/com/binance/connector/client/derivatives_trading_portfolio_margin/rest/account/ChangeCmInitialLeverageExample.java
        go: https://raw.githubusercontent.com/binance/binance-connector-go/main/clients/derivativestradingportfoliomargin/examples/restapi/AccountAPI/ChangeCmInitialLeverage/ChangeCmInitialLeverage.go
        php: https://raw.githubusercontent.com/binance/binance-connector-php/master/examples/derivatives-trading-portfolio-margin/account/ChangeCmInitialLeverageExample.php
      x-ip-weight: 1
      x-security-type: TRADE
      x-signed: true
      parameters:
        - name: X-MBX-APIKEY
          in: header
          required: true
          description: 访问此接口需要 API Key，并且必须在请求头中携带。关于如何创建 API Key，请参考：[https://www.binance.com/cn/support/faq/detail/360002502072](https://www.binance.com/cn/support/faq/detail/360002502072)。
          schema:
            type: string
            example: API_KEY
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - symbol
                - leverage
                - timestamp
              properties:
                symbol:
                  type: string
                  example: BTCUSD_200925
                leverage:
                  type: integer
                  example: 21
                  minimum: 1
                  maximum: 125
                  format: int64
                  description: 目标初始杠杆倍数
                recvWindow:
                  type: integer
                  example: 5000
                  format: int64
                timestamp:
                  type: integer
                  example: 1770736694138
                  format: int64
                  description: 用于请求签名的 Unix 时间戳，单位为毫秒. 该值必须反映客户端当前时间，并会在签名接口中由服务器进行校验.
      responses:
        '200':
          description: 修改CM Initial Leverage
          content:
            application/json:
              schema:
                type: object
                properties:
                  leverage:
                    type: integer
                    example: 21
                    format: int64
                    description: 杠杆倍率
                  maxQty:
                    type: string
                    example: '1000'
                    description: maximum quantity of base asset
                  symbol:
                    type: string
                    example: BTCUSD_200925
                    description: 交易对（如存在）。
  /papi/v1/cm/positionSide/dual:
    post:
      summary: 更改CM持仓模式 (TRADE)
      description: 变换用户在 CM 所有 symbol 合约上的持仓模式：双向持仓或单向持仓。
      tags:
        - account
      operationId: changeCmPositionMode
      externalDocs:
