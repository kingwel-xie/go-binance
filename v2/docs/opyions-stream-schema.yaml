openapi: 3.0.2
info:
  title: Options WebSocket Market Streams
  description: 访问市场数据、管理账户，并交易 Binance 期权。
  version: 1.0.0
x-product-type: ws-streams
x-user-data-streams: true
tags:
  - name: public
    x-displayName: 公开
    x-url-segment: /public
  - name: market
    x-displayName: 市场
    x-url-segment: /market
servers:
  - url: wss://fstream.binance.com
  - url: wss://fstream.binancefuture.com
paths:
  /!index@arr:
    post:
      summary: 指数价格
      description: 指数价格
      tags:
        - market
      operationId: indexPriceStreams
      externalDocs:
        url: https://developers.binance.com/en/docs/catalog/core-trading-derivatives-trading-options/api/ws-streams/market#index-price-streams
      x-connectors-examples:
        ts: https://raw.githubusercontent.com/binance/binance-connector-js/master/clients/derivatives-trading-options/examples/websocket-streams/MarketApi/indexPriceStreams.ts
        rust: https://raw.githubusercontent.com/binance/binance-connector-rust/main/examples/derivatives_trading_options/websocket_streams/market_api/index_price_streams.rs
        python: https://raw.githubusercontent.com/binance/binance-connector-python/master/clients/derivatives_trading_options/examples/websocket_streams/Market/index_price_streams.py
        java: https://raw.githubusercontent.com/binance/binance-connector-java/master/examples/derivatives-trading-options/src/main/java/com/binance/connector/client/derivatives_trading_options/websocket/stream/websocketmarketstreams/market/IndexPriceStreamsExample.java
        go: https://raw.githubusercontent.com/binance/binance-connector-go/main/clients/derivativestradingoptions/examples/websocketstreams//MarketAPI/IndexPriceStreams/IndexPriceStreams.go
      x-update-speed: 1000ms
      parameters:
        - name: id
          in: query
          required: false
          schema:
            type: integer
            example: 532601580
            format: int32
          description: 唯一 WebSocket 请求 ID。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                method:
                  type: string
                  description: WebSocket 数据流方法名称。
                  enum:
                    - SUBSCRIBE
                  example: SUBSCRIBE
                params:
                  type: array
                  items:
                    type: string
                  description: 要订阅的数据流列表。
                  example:
                    - '!index@arr'
                id:
                  type: integer
                  example: 532601580
                  format: int32
                  description: 唯一的 WebSocket 请求 ID。
              required:
                - method
                - params
                - id
              additionalProperties: false
            example:
              method: SUBSCRIBE
              params:
                - '!index@arr'
              id: 532601580
      responses:
        Raw Stream:
          description: 指数价格流
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    e:
                      type: string
                      example: indexPrice
                      description: 事件类型
                    E:
                      type: integer
                      example: 1763092572229
                      format: int64
                      description: 时间
                    s:
                      type: string
                      example: ETHUSDT
                      description: 标的交易对
                    p:
                      type: string
                      example: '3224.51976744'
                      description: 指数价格
              example:
                - e: indexPrice
                  E: 1763092572229
                  s: ETHUSDT
                  p: '3224.51976744'
        Combined Stream:
          description: Stream payload with stream name.
          content:
            application/json:
              schema:
                type: object
                properties:
                  stream:
                    type: string
                    example: '!index@arr'
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        e:
                          type: string
                          example: indexPrice
                          description: 事件类型
                        E:
                          type: integer
                          example: 1763092572229
                          format: int64
                          description: 时间
                        s:
                          type: string
                          example: ETHUSDT
                          description: 标的交易对
                        p:
                          type: string
                          example: '3224.51976744'
                          description: 指数价格
                required:
                  - stream
                  - data
                additionalProperties: false
              example:
                stream: '!index@arr'
                data:
                  - e: indexPrice
                    E: 1763092572229
                    s: ETHUSDT
                    p: '3224.51976744'
  /{symbol}@kline_{interval}:
    post:
      summary: K线
      description: K线流每1000毫秒推送当前K线更新（如果存在）。
      tags:
        - market
      operationId: klineCandlestickStreams
      externalDocs:
        url: https://developers.binance.com/en/docs/catalog/core-trading-derivatives-trading-options/api/ws-streams/market#kline-candlestick-streams
      x-connectors-examples:
        ts: https://raw.githubusercontent.com/binance/binance-connector-js/master/clients/derivatives-trading-options/examples/websocket-streams/MarketApi/klineCandlestickStreams.ts
        rust: https://raw.githubusercontent.com/binance/binance-connector-rust/main/examples/derivatives_trading_options/websocket_streams/market_api/kline_candlestick_streams.rs
        python: https://raw.githubusercontent.com/binance/binance-connector-python/master/clients/derivatives_trading_options/examples/websocket_streams/Market/kline_candlestick_streams.py
        java: https://raw.githubusercontent.com/binance/binance-connector-java/master/examples/derivatives-trading-options/src/main/java/com/binance/connector/client/derivatives_trading_options/websocket/stream/websocketmarketstreams/market/KlineCandlestickStreamsExample.java
        go: https://raw.githubusercontent.com/binance/binance-connector-go/main/clients/derivativestradingoptions/examples/websocketstreams//MarketAPI/KlineCandlestickStreams/KlineCandlestickStreams.go
      x-update-speed: 1000ms
      parameters:
        - name: id
          in: query
          required: false
          schema:
            type: integer
            example: 532601580
            format: int32
          description: 唯一 WebSocket 请求 ID。
        - name: symbol
          in: path
          required: true
          schema:
            type: string
            example: btcusdt
          description: 交易对参数
        - name: interval
          in: path
          required: true
          schema:
            type: string
            example: 1m
            enum:
              - 1m
              - 3m
              - 5m
              - 15m
              - 30m
              - 1h
              - 2h
              - 4h
              - 6h
              - 12h
              - 1d
              - 3d
              - 1w
          description: 间隔参数
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                method:
                  type: string
                  description: WebSocket 数据流方法名称。
                  enum:
                    - SUBSCRIBE
                  example: SUBSCRIBE
                params:
                  type: array
                  items:
                    type: string
                  description: 要订阅的数据流列表。
                  example:
                    - btcusdt@kline_1m
                id:
                  type: integer
                  example: 532601580
                  format: int32
                  description: 唯一的 WebSocket 请求 ID。
              required:
                - method
                - params
                - id
              additionalProperties: false
            example:
              method: SUBSCRIBE
              params:
                - btcusdt@kline_1m
              id: 532601580
      responses:
        Raw Stream:
          description: K 线流
          content:
            application/json:
              schema:
                type: object
                properties:
                  e:
                    type: string
                    example: kline
                    description: 事件类型
                  E:
                    type: integer
                    example: 1638747660000
                    format: int64
                    description: 事件时间
                  s:
                    type: string
                    example: BTC-200630-9000-P
                    description: 交易对
                  k:
                    type: object
                    properties:
                      t:
                        type: integer
                        example: 1638747660000
                        format: int64
                        description: 这根K线的起始时间
                      T:
                        type: integer
                        example: 1638747719999
                        format: int64
                        description: 这根K线的结束时间
                      s:
                        type: string
                        example: BTC-200630-9000-P
                        description: 交易对
                      i:
                        type: string
                        example: 1m
                        description: K线间隔
                      f:
                        type: integer
                        example: 0
                        format: int64
                        description: 这根K线期间第一笔成交ID
                      L:
                        type: integer
                        example: 0
                        format: int64
                        description: 这根K线期间末一笔成交ID
                      o:
                        type: string
                        example: '1000'
                        description: 这根K线期间第一笔成交价
                      c:
                        type: string
                        example: '1000'
                        description: 这根K线期间末一笔成交价
                      h:
                        type: string
                        example: '1000'
                        description: 这根K线期间最高成交价
                      l:
                        type: string
                        example: '1000'
                        description: 这根K线期间最低成交价
                      v:
                        type: string
                        example: '0'
                        description: 这根K线期间成交量
                      'n':
                        type: integer
                        example: 0
                        format: int64
                        description: 这根K线期间成交笔数
                      x:
                        type: boolean
                        example: false
                        description: 这根K线是否完结(是否已经开始下一根K线)
                      q:
                        type: string
                        example: '0'
                        description: 这根K线期间成交额
                      V:
                        type: string
                        example: '0'
                        description: 主动买入的成交额
                      Q:
                        type: string
                        example: '0'
                        description: 主动买入的成交量
                    description: K 线数据
              example:
                e: kline
                E: 1638747660000
                s: BTC-200630-9000-P
                k:
                  t: 1638747660000
                  T: 1638747719999
                  s: BTC-200630-9000-P
                  i: 1m
                  f: 0
                  L: 0
                  o: '1000'
                  c: '1000'
                  h: '1000'
                  l: '1000'
                  v: '0'
                  'n': 0
                  x: false
                  q: '0'
                  V: '0'
                  Q: '0'
        Combined Stream:
          description: Stream payload with stream name.
          content:
            application/json:
              schema:
                type: object
                properties:
                  stream:
                    type: string
                    example: btcusdt@kline_1m
                  data:
                    type: object
                    properties:
                      e:
                        type: string
                        example: kline
                        description: 事件类型
                      E:
                        type: integer
                        example: 1638747660000
                        format: int64
                        description: 事件时间
                      s:
                        type: string
                        example: BTC-200630-9000-P
                        description: 交易对
                      k:
                        type: object
                        properties:
                          t:
                            type: integer
                            example: 1638747660000
                            format: int64
                            description: 这根K线的起始时间
                          T:
                            type: integer
                            example: 1638747719999
                            format: int64
                            description: 这根K线的结束时间
                          s:
                            type: string
                            example: BTC-200630-9000-P
                            description: 交易对
                          i:
                            type: string
                            example: 1m
                            description: K线间隔
                          f:
                            type: integer
                            example: 0
                            format: int64
                            description: 这根K线期间第一笔成交ID
                          L:
                            type: integer
                            example: 0
                            format: int64
                            description: 这根K线期间末一笔成交ID
                          o:
                            type: string
                            example: '1000'
                            description: 这根K线期间第一笔成交价
                          c:
                            type: string
                            example: '1000'
                            description: 这根K线期间末一笔成交价
                          h:
                            type: string
                            example: '1000'
                            description: 这根K线期间最高成交价
                          l:
                            type: string
                            example: '1000'
                            description: 这根K线期间最低成交价
                          v:
                            type: string
                            example: '0'
                            description: 这根K线期间成交量
                          'n':
                            type: integer
                            example: 0
                            format: int64
                            description: 这根K线期间成交笔数
                          x:
                            type: boolean
                            example: false
                            description: 这根K线是否完结(是否已经开始下一根K线)
                          q:
                            type: string
                            example: '0'
                            description: 这根K线期间成交额
                          V:
                            type: string
                            example: '0'
                            description: 主动买入的成交额
                          Q:
                            type: string
                            example: '0'
                            description: 主动买入的成交量
                        description: K 线数据
                required:
                  - stream
                  - data
                additionalProperties: false
              example:
                stream: btcusdt@kline_1m
                data:
                  e: kline
                  E: 1638747660000
                  s: BTC-200630-9000-P
                  k:
                    t: 1638747660000
                    T: 1638747719999
                    s: BTC-200630-9000-P
                    i: 1m
                    f: 0
                    L: 0
                    o: '1000'
                    c: '1000'
                    h: '1000'
                    l: '1000'
                    v: '0'
                    'n': 0
                    x: false
                    q: '0'
                    V: '0'
                    Q: '0'
  /{underlying}@optionMarkPrice:
    post:
      summary: 标记价格
      description: 特定标的资产的所有期权交易对的标记价格。例如：[btcusdt@optionMarkPrice](wss://fstream.binance.com/market/stream?streams=btcusdt@optionMarkPrice)
      tags:
        - market
      operationId: optionMarkPrice
      externalDocs:
        url: https://developers.binance.com/en/docs/catalog/core-trading-derivatives-trading-options/api/ws-streams/market#option-mark-price
      x-connectors-examples:
        ts: https://raw.githubusercontent.com/binance/binance-connector-js/master/clients/derivatives-trading-options/examples/websocket-streams/MarketApi/optionMarkPrice.ts
        rust: https://raw.githubusercontent.com/binance/binance-connector-rust/main/examples/derivatives_trading_options/websocket_streams/market_api/option_mark_price.rs
        python: https://raw.githubusercontent.com/binance/binance-connector-python/master/clients/derivatives_trading_options/examples/websocket_streams/Market/option_mark_price.py
