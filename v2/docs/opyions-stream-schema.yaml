components:
  schemas:
    accountUpdate:
      type: object
      properties:
        e:
          type: string
          enum:
            - ACCOUNT_UPDATE
          description: 事件类型
        E:
          type: integer
          example: 1762914568643
          format: int64
          description: 事件时间
        T:
          type: integer
          example: 1762914568619
          format: int64
          description: 交易时间
        eq:
          type: string
          example: '10000371.61462086'
          description: 账户USDT权益
        aeq:
          type: string
          example: '10000475.51032086'
          description: 账户调整权益
        b:
          type: string
          example: '10000475.51032086'
          description: 账户USDT余额
        m:
          type: string
          example: '-103.89570000'
          description: 仓位价值
        u:
          type: string
          example: '16.10430000'
          description: 未实现盈利
        i:
          type: string
          example: '32354.38562539'
          description: 初始保证金
        M:
          type: string
          example: '6089.28766956'
          description: 维持保证金
    balancePositionUpdate:
      type: object
      properties:
        e:
          type: string
          enum:
            - BALANCE_POSITION_UPDATE
          description: 事件类型
        E:
          type: integer
          example: 1762917544216
          format: int64
          description: 事件时间
        T:
          type: integer
          example: 1762917544206
          format: int64
          description: 交易时间
        m:
          type: string
          example: ORDER
          enum:
            - DEPOSIT
            - WITHDRAW
            - ORDER
          description: 事件推出原因
        B:
          type: array
          description: 余额信息
          items:
            type: object
            properties:
              a:
                type: string
                example: USDT
                description: 资产
              b:
                type: string
                example: '10000471.37940900'
                description: 钱包余额
              bc:
                type: string
                example: '0'
                description: 除去盈亏与交易手续费以外的钱包余额改变量
        P:
          type: array
          description: 持仓
          items:
            type: object
            properties:
              s:
                type: string
                example: BTC-251123-126000-C
                description: 交易对
              c:
                type: string
                example: '-0.1000'
                description: 仓位
              p:
                type: string
                example: '-120.00000000'
                description: 仓位价值
              a:
                type: string
                example: '1200.00000000'
                description: 仓位均价
    greekUpdate:
      type: object
      properties:
        e:
          type: string
          enum:
            - GREEK_UPDATE
          description: 事件类型
        E:
          type: integer
          example: 1762917544216
          format: int64
          description: 事件时间
        T:
          type: integer
          example: 1762917544216
          format: int64
          description: 交易时间
        G:
          type: array
          items:
            type: object
            properties:
              u:
                type: string
                example: BTCUSDT
                description: 标的
              d:
                type: string
                example: '-0.01304097'
                description: Delta
              g:
                type: string
                example: '-0.00000124'
                description: Gamma
              t:
                type: string
                example: '16.11648100'
                description: Theta
              v:
                type: string
                example: '-3.83444011'
                description: Vega
    listenKeyExpired:
      type: object
      properties:
        e:
          type: string
          enum:
            - listenKeyExpired
          description: 事件类型
        E:
          type: string
          example: '1736996475556'
          description: 事件时间
        listenKey:
          type: string
          example: WsCMN0a4KHUPTQuX6IUnqEZfB1inxmv1qR4kbf1LuEjur5VdbzqvyxqG9TSjVVxv
    orderTradeUpdate:
      type: object
      properties:
        e:
          type: string
          enum:
            - ORDER_TRADE_UPDATE
          description: 事件类型
        E:
          type: integer
          example: 1568879465651
          format: int64
          description: 事件时间
        T:
          type: integer
          example: 1568879465650
          format: int64
          description: 交易时间
        o:
          type: object
          properties:
            s:
              type: string
              example: BTCUSDT
              description: 交易对
            c:
              type: string
              example: TEST
              description: 客户端自定订单ID
            S:
              type: string
              example: SELL
              enum:
                - BUY
                - SELL
              description: 方向
            o:
              type: string
              example: TRAILING_STOP_MARKET
              enum:
                - LIMIT
              description: 订单类型
            f:
              type: string
              example: GTC
              enum:
                - GTC
                - IOC
                - FOK
                - GTX
              description: 有效方式
            q:
              type: string
              example: '0.001'
              description: 订单原始数量
            p:
              type: string
              example: '0'
              description: 订单原始价格
            ap:
              type: string
              example: '0'
              description: 订单平均价格
            x:
              type: string
              example: NEW
              enum:
                - NEW
                - CANCELED
                - EXPIRED
                - TRADE
              description: 本次事件的具体执行类型
            X:
              type: string
              example: NEW
              enum:
                - NEW
                - PARTIALLY_FILLED
                - FILLED
                - CANCELED
