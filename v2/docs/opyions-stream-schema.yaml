                  format: int32
                  description: 唯一的 WebSocket 请求 ID。
              required:
                - method
                - params
                - id
              additionalProperties: false
            example:
              method: SUBSCRIBE
              params:
                - btcusdt@optionMarkPrice
              id: 532601580
      responses:
        Raw Stream:
          description: 标记价格
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    s:
                      type: string
                      example: BTC-251120-126000-C
                      description: 交易对
                    mp:
                      type: string
                      example: '770.543'
                      description: 标记价格
                    E:
                      type: integer
                      example: 1762867543321
                      format: int64
                      description: 事件时间
                    e:
                      type: string
                      example: markPrice
                      description: 事件类型
                    i:
                      type: string
                      example: '104334.60217391'
                      description: 指数价格
                    P:
                      type: string
                      example: '0.000'
                      description: 预估结算价，结算前半小时有效
                    bo:
                      type: string
                      example: '0.000'
                      description: 买一价格
                    ao:
                      type: string
                      example: '900.000'
                      description: 卖一价格
                    bq:
                      type: string
                      example: '0.0000'
                      description: 买一数量
                    aq:
                      type: string
                      example: '0.2000'
                      description: 卖一数量
                    b:
                      type: string
                      example: '-1.0'
                      description: 买一隐含波动率
                    a:
                      type: string
                      example: '0.98161161'
                      description: 卖一隐含波动率
                    hl:
                      type: string
                      example: '924.652'
                      description: 最高买价
                    ll:
                      type: string
                      example: '616.435'
                      description: 最低卖价
                    vo:
                      type: string
                      example: '0.9408058'
                      description: 隐含波动率
                    rf:
                      type: string
                      example: '0.0'
                      description: 无风险利率
                    d:
                      type: string
                      example: '0.11111964'
                      description: 德尔塔
                    t:
                      type: string
                      example: '-164.26702615'
                      description: 西塔
                    g:
                      type: string
                      example: '0.00001245'
                      description: 伽马
                    v:
                      type: string
                      example: '30.63855919'
                      description: 维加
              example:
                - s: BTC-251120-126000-C
                  mp: '770.543'
                  E: 1762867543321
                  e: markPrice
                  i: '104334.60217391'
                  P: '0.000'
                  bo: '0.000'
                  ao: '900.000'
                  bq: '0.0000'
                  aq: '0.2000'
                  b: '-1.0'
                  a: '0.98161161'
                  hl: '924.652'
                  ll: '616.435'
                  vo: '0.9408058'
                  rf: '0.0'
                  d: '0.11111964'
                  t: '-164.26702615'
                  g: '0.00001245'
                  v: '30.63855919'
        Combined Stream:
          description: Stream payload with stream name.
          content:
            application/json:
              schema:
                type: object
