  /!optionSymbol:
    post:
      summary: 新增交易对信息推送
      description: 新增交易对信息推送
      tags:
        - market
      operationId: newSymbolInfo
      externalDocs:
        url: https://developers.binance.com/en/docs/catalog/core-trading-derivatives-trading-options/api/ws-streams/market#new-symbol-info
      x-connectors-examples:
        ts: https://raw.githubusercontent.com/binance/binance-connector-js/master/clients/derivatives-trading-options/examples/websocket-streams/MarketApi/newSymbolInfo.ts
        rust: https://raw.githubusercontent.com/binance/binance-connector-rust/main/examples/derivatives_trading_options/websocket_streams/market_api/new_symbol_info.rs
        python: https://raw.githubusercontent.com/binance/binance-connector-python/master/clients/derivatives_trading_options/examples/websocket_streams/Market/new_symbol_info.py
        java: https://raw.githubusercontent.com/binance/binance-connector-java/master/examples/derivatives-trading-options/src/main/java/com/binance/connector/client/derivatives_trading_options/websocket/stream/websocketmarketstreams/market/NewSymbolInfoExample.java
        go: https://raw.githubusercontent.com/binance/binance-connector-go/main/clients/derivativestradingoptions/examples/websocketstreams//MarketAPI/NewSymbolInfo/NewSymbolInfo.go
