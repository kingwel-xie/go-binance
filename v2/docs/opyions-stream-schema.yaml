                        i:
                          type: string
                          example: '104334.60217391'
                          description: 指数价格
                        P:
                          type: string
                          example: '0.000'
                          description: 预估结算价，结算前半小时有效
                        bo:
                          type: string
                          example: '0.000'
                          description: 买一价格
                        ao:
                          type: string
                          example: '900.000'
                          description: 卖一价格
                        bq:
                          type: string
                          example: '0.0000'
                          description: 买一数量
                        aq:
                          type: string
                          example: '0.2000'
                          description: 卖一数量
                        b:
                          type: string
                          example: '-1.0'
                          description: 买一隐含波动率
                        a:
                          type: string
                          example: '0.98161161'
                          description: 卖一隐含波动率
                        hl:
                          type: string
                          example: '924.652'
                          description: 最高买价
                        ll:
                          type: string
                          example: '616.435'
                          description: 最低卖价
                        vo:
                          type: string
                          example: '0.9408058'
                          description: 隐含波动率
                        rf:
                          type: string
