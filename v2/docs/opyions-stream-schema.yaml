        go: https://raw.githubusercontent.com/binance/binance-connector-go/main/clients/derivativestradingoptions/examples/websocketstreams//MarketAPI/OptionMarkPrice/OptionMarkPrice.go
      x-update-speed: 1000ms
      parameters:
        - name: id
          in: query
          required: false
          schema:
            type: integer
            example: 532601580
            format: int32
          description: 唯一 WebSocket 请求 ID。
        - name: underlying
          in: path
          required: true
          schema:
            type: string
            example: btcusdt
          description: 标的资产参数
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                method:
                  type: string
                  description: WebSocket 数据流方法名称。
                  enum:
                    - SUBSCRIBE
                  example: SUBSCRIBE
                params:
                  type: array
                  items:
                    type: string
                  description: 要订阅的数据流列表。
                  example:
                    - btcusdt@optionMarkPrice
                id:
                  type: integer
