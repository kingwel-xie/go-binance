                  description: '**迁移后,本接口不再接受 stop 类型(`STOP`/`STOP_MARKET`/`TAKE_PROFIT`/`TAKE_PROFIT_MARKET`/`TRAILING_STOP_MARKET`),会返回 `-4120`。请改用新接口 `/dapi/v1/algoOrder`。**'
                reduceOnly:
