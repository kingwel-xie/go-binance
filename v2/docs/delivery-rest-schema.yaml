        rust: https://raw.githubusercontent.com/binance/binance-connector-rust/main/examples/derivatives_trading_coin_futures/rest_api/trade_api/auto_cancel_all_open_orders.rs
        python: https://raw.githubusercontent.com/binance/binance-connector-python/master/clients/derivatives_trading_coin_futures/examples/rest_api/Trade/auto_cancel_all_open_orders.py
        java: https://raw.githubusercontent.com/binance/binance-connector-java/master/examples/derivatives-trading-coin-futures/src/main/java/com/binance/connector/client/derivatives_trading_coin_futures/rest/trade/AutoCancelAllOpenOrdersExample.java
        go: https://raw.githubusercontent.com/binance/binance-connector-go/main/clients/derivativestradingcoinfutures/examples/restapi/TradeAPI/AutoCancelAllOpenOrders/AutoCancelAllOpenOrders.go
        php: https://raw.githubusercontent.com/binance/binance-connector-php/master/examples/derivatives-trading-coin-futures/trade/AutoCancelAllOpenOrdersExample.php
      x-ip-weight: 10
      x-security-type: TRADE
      x-signed: true
      parameters:
        - name: X-MBX-APIKEY
          in: header
          required: true
          description: 访问此接口需要 API Key，并且必须在请求头中携带。关于如何创建 API Key，请参考：[https://www.binance.com/cn/support/faq/detail/360002502072](https://www.binance.com/cn/support/faq/detail/360002502072)。
          schema:
            type: string
            example: API_KEY
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - symbol
                - countdownTime
                - timestamp
              properties:
                symbol:
                  type: string
                  example: BTCUSD_200925
                countdownTime:
                  type: integer
                  example: 1000
                  format: int64
                  description: 倒计时。 1000 表示 1 秒； 0 表示取消倒计时撤单功能。
                recvWindow:
                  type: integer
                  example: 5000
                  format: int64
                  maximum: 60000
                timestamp:
                  type: integer
                  example: 1770736694138
                  format: int64
                  description: 用于请求签名的 Unix 时间戳，单位为毫秒. 该值必须反映客户端当前时间，并会在签名接口中由服务器进行校验.
      responses:
        '200':
          description: Auto-取消All 未完成订单
          content:
            application/json:
              schema:
                type: object
                properties:
                  symbol:
                    type: string
                    example: BTCUSD_200925
                    description: 交易对
                  countdownTime:
                    type: string
                    example: '100000'
                    description: 倒计时撤单时间（毫秒）.
