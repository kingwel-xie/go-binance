openapi: 3.0.2
info:
  title: Futures (COIN-M) REST API
  description: 访问市场数据、管理账户，并交易 COIN-M 永续和交割合约。
  version: 1.0.0
  termsOfService: https://www.binance.com/en/terms
  contact:
    name: Binance API Support
    url: https://www.binance.com/en/support
x-product-type: rest-api
x-rate-limits-guide: products/derivatives-trading-coin-futures/general-info#访问限制
x-security-guide: products/derivatives-trading-coin-futures/general-info#接口鉴权类型
x-api-key-guide: https://www.binance.com/cn/support/faq/detail/360002502072
externalDocs:
  description: Futures (COIN-M) docs
  url: https://developers.binance.com/en/docs/products/derivatives-trading-coin-futures/general-info
tags:
  - name: account
    x-displayName: 账户接口
  - name: market-data
    x-displayName: 行情接口
  - name: portfolio-margin-endpoints
    x-displayName: 经典统一账户接口
  - name: trade
    x-displayName: 交易接口
  - name: user-data-streams
    x-displayName: Websocket账户信息推送
servers:
  - url: https://dapi.binance.com
  - url: https://testnet.binancefuture.com
paths:
  /dapi/v1/account:
    get:
      summary: 账户信息 (USER_DATA)
      description: 查询账户信息
      tags:
        - account
      operationId: accountInformation
      externalDocs:
        url: https://developers.binance.com/en/docs/catalog/core-trading-derivatives-trading-coin-m-futures/api/rest-api/account#account-information
      x-connectors-examples:
        ts: https://raw.githubusercontent.com/binance/binance-connector-js/master/clients/derivatives-trading-coin-futures/examples/rest-api/AccountApi/accountInformation.ts
        rust: https://raw.githubusercontent.com/binance/binance-connector-rust/main/examples/derivatives_trading_coin_futures/rest_api/account_api/account_information.rs
        python: https://raw.githubusercontent.com/binance/binance-connector-python/master/clients/derivatives_trading_coin_futures/examples/rest_api/Account/account_information.py
        java: https://raw.githubusercontent.com/binance/binance-connector-java/master/examples/derivatives-trading-coin-futures/src/main/java/com/binance/connector/client/derivatives_trading_coin_futures/rest/account/AccountInformationExample.java
        go: https://raw.githubusercontent.com/binance/binance-connector-go/main/clients/derivativestradingcoinfutures/examples/restapi/AccountAPI/AccountInformation/AccountInformation.go
        php: https://raw.githubusercontent.com/binance/binance-connector-php/master/examples/derivatives-trading-coin-futures/account/AccountInformationExample.php
      x-ip-weight: 5
      x-security-type: USER_DATA
      x-signed: true
      parameters:
        - name: X-MBX-APIKEY
          in: header
          required: true
          description: 访问此接口需要 API Key，并且必须在请求头中携带。关于如何创建 API Key，请参考：[https://www.binance.com/cn/support/faq/detail/360002502072](https://www.binance.com/cn/support/faq/detail/360002502072)。
          schema:
            type: string
            example: API_KEY
        - name: recvWindow
          in: query
          required: false
          schema:
            type: integer
            example: 5000
            format: int64
            maximum: 60000
        - name: timestamp
          in: query
          required: true
          schema:
            type: integer
            example: 1770736694138
            format: int64
          description: 用于请求签名的 Unix 时间戳，单位为毫秒. 该值必须反映客户端当前时间，并会在签名接口中由服务器进行校验.
      x-parameters-notes: |-
        - 对于单向持仓模式，"positions"仅会展示"BOTH"方向的持仓
        - 对于双向持仓模式，"positions"会展示所有"BOTH", "LONG", 和"SHORT"方向的持仓
      responses:
        '200':
          description: 账户 信息
          content:
            application/json:
              schema:
                type: object
                properties:
                  assets:
                    type: array
                    items:
                      type: object
                      properties:
                        asset:
                          type: string
                          example: BTC
                          description: 资产
                        walletBalance:
                          type: string
                          example: '0.00241969'
                          description: 账户余额
                        unrealizedProfit:
                          type: string
                          example: '0.00000000'
                          description: 全部持仓未实现盈亏
                        marginBalance:
                          type: string
                          example: '0.00241969'
                          description: 保证金余额
                        maintMargin:
                          type: string
                          example: '0.00000000'
                          description: 维持保证金
                        initialMargin:
                          type: string
                          example: '0.00000000'
                          description: 当前所需起始保证金(按最新标标记价格)
                        positionInitialMargin:
                          type: string
                          example: '0.00000000'
                          description: 当前所需持仓起始保证金(按最新标标记价格)
                        openOrderInitialMargin:
                          type: string
                          example: '0.00000000'
                          description: 当前所需挂单起始保证金(按最新标标记价格)
                        maxWithdrawAmount:
                          type: string
                          example: '0.00241969'
                          description: 最大可转出余额
                        crossWalletBalance:
                          type: string
                          example: '0.00241969'
                          description: 可用于全仓的账户余额
                        crossUnPnl:
                          type: string
                          example: '0.00000000'
                          description: 所有全仓持仓的未实现盈亏
                        availableBalance:
                          type: string
                          example: '0.00241969'
                          description: 可用下单余额
                        updateTime:
                          type: integer
                          example: 1625474304765
                          format: int64
                          description: 更新时间
                    description: 支持的资产列表。
                  positions:
                    type: array
                    items:
                      type: object
                      properties:
                        symbol:
                          type: string
                          example: BTCUSD_201225
                          description: 交易对
                        positionAmt:
                          type: string
                          example: '0'
                          description: 持仓数量
                        initialMargin:
                          type: string
                          example: '0'
                          description: 当前所需起始保证金(按最新标标记价格)
                        maintMargin:
                          type: string
                          example: '0'
                          description: 维持保证金
                        unrealizedProfit:
                          type: string
                          example: '0.00000000'
                          description: 全部持仓未实现盈亏
                        positionInitialMargin:
                          type: string
                          example: '0'
                          description: 当前所需持仓起始保证金(按最新标标记价格)
                        openOrderInitialMargin:
                          type: string
                          example: '0'
                          description: 当前所需挂单起始保证金(按最新标标记价格)
                        leverage:
                          type: string
                          example: '125'
                          description: 杠杆倍数.
                        isolated:
                          type: boolean
                          example: false
                          description: 是否为逐仓模式.
                        positionSide:
                          type: string
                          example: BOTH
                          description: 持仓方向
                        entryPrice:
                          type: string
                          example: '0.0'
                          description: 持仓开仓价格.
                        breakEvenPrice:
                          type: string
                          example: '0.0'
                          description: 盈亏平衡价
                        maxQty:
                          type: string
                          example: '50'
                          description: 数量上限, 最大数量
                        updateTime:
                          type: integer
                          example: 0
                          format: int64
                          description: 更新时间
                        notionalValue:
                          type: string
                          example: '0'
                          description: 名义价值.
                    description: 持仓列表.
                  canDeposit:
                    type: boolean
                    example: true
                    description: 是否可充值.
                  canTrade:
                    type: boolean
                    example: true
                    description: 是否可交易.
                  canWithdraw:
                    type: boolean
                    example: true
                    description: 是否可提现.
                  feeTier:
                    type: integer
                    example: 2
                    format: int64
                    description: 手续费等级.
                  updateTime:
                    type: integer
                    example: 0
                    format: int64
                    description: 更新时间
  /dapi/v1/balance:
    get:
      summary: 账户余额 (USER_DATA)
      description: 查询账户余额
      tags:
        - account
      operationId: futuresAccountBalance
      externalDocs:
        url: https://developers.binance.com/en/docs/catalog/core-trading-derivatives-trading-coin-m-futures/api/rest-api/account#futures-account-balance
      x-connectors-examples:
        ts: https://raw.githubusercontent.com/binance/binance-connector-js/master/clients/derivatives-trading-coin-futures/examples/rest-api/AccountApi/futuresAccountBalance.ts
        rust: https://raw.githubusercontent.com/binance/binance-connector-rust/main/examples/derivatives_trading_coin_futures/rest_api/account_api/futures_account_balance.rs
        python: https://raw.githubusercontent.com/binance/binance-connector-python/master/clients/derivatives_trading_coin_futures/examples/rest_api/Account/futures_account_balance.py
        java: https://raw.githubusercontent.com/binance/binance-connector-java/master/examples/derivatives-trading-coin-futures/src/main/java/com/binance/connector/client/derivatives_trading_coin_futures/rest/account/FuturesAccountBalanceExample.java
        go: https://raw.githubusercontent.com/binance/binance-connector-go/main/clients/derivativestradingcoinfutures/examples/restapi/AccountAPI/FuturesAccountBalance/FuturesAccountBalance.go
        php: https://raw.githubusercontent.com/binance/binance-connector-php/master/examples/derivatives-trading-coin-futures/account/FuturesAccountBalanceExample.php
      x-ip-weight: 1
      x-security-type: USER_DATA
      x-signed: true
      parameters:
        - name: X-MBX-APIKEY
          in: header
          required: true
          description: 访问此接口需要 API Key，并且必须在请求头中携带。关于如何创建 API Key，请参考：[https://www.binance.com/cn/support/faq/detail/360002502072](https://www.binance.com/cn/support/faq/detail/360002502072)。
          schema:
            type: string
            example: API_KEY
        - name: recvWindow
          in: query
          required: false
          schema:
            type: integer
            example: 5000
            format: int64
            maximum: 60000
        - name: timestamp
          in: query
          required: true
          schema:
            type: integer
            example: 1770736694138
            format: int64
          description: 用于请求签名的 Unix 时间戳，单位为毫秒. 该值必须反映客户端当前时间，并会在签名接口中由服务器进行校验.
      responses:
        '200':
          description: 合约 账户 Balance
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    accountAlias:
                      type: string
                      example: SgsR
                      description: 账户唯一识别码
                    asset:
                      type: string
                      example: BTC
                      description: 资产
                    balance:
                      type: string
                      example: '0.00250000'
                      description: 账户余额.
                    withdrawAvailable:
                      type: string
                      example: '0.00250000'
                      description: 可提现金额.
                    crossWalletBalance:
                      type: string
                      example: '0.00241969'
                      description: 可用于全仓的账户余额
                    crossUnPnl:
                      type: string
                      example: '0.00000000'
                      description: 所有全仓持仓的未实现盈亏
                    availableBalance:
                      type: string
                      example: '0.00241969'
                      description: 可用下单余额
                    updateTime:
                      type: integer
                      example: 1592468353979
                      format: int64
                      description: 更新时间
  /dapi/v1/positionSide/dual:
    get:
      summary: 查询持仓模式 (USER_DATA)
      description: 查询用户目前在 ***所有symbol*** 合约上的持仓模式：双向持仓或单向持仓。
      tags:
        - account
      operationId: getCurrentPositionMode
      externalDocs:
        url: https://developers.binance.com/en/docs/catalog/core-trading-derivatives-trading-coin-m-futures/api/rest-api/account#get-current-position-mode
      x-connectors-examples:
        ts: https://raw.githubusercontent.com/binance/binance-connector-js/master/clients/derivatives-trading-coin-futures/examples/rest-api/AccountApi/getCurrentPositionMode.ts
        rust: https://raw.githubusercontent.com/binance/binance-connector-rust/main/examples/derivatives_trading_coin_futures/rest_api/account_api/get_current_position_mode.rs
        python: https://raw.githubusercontent.com/binance/binance-connector-python/master/clients/derivatives_trading_coin_futures/examples/rest_api/Account/get_current_position_mode.py
        java: https://raw.githubusercontent.com/binance/binance-connector-java/master/examples/derivatives-trading-coin-futures/src/main/java/com/binance/connector/client/derivatives_trading_coin_futures/rest/account/GetCurrentPositionModeExample.java
        go: https://raw.githubusercontent.com/binance/binance-connector-go/main/clients/derivativestradingcoinfutures/examples/restapi/AccountAPI/GetCurrentPositionMode/GetCurrentPositionMode.go
        php: https://raw.githubusercontent.com/binance/binance-connector-php/master/examples/derivatives-trading-coin-futures/account/GetCurrentPositionModeExample.php
      x-ip-weight: 30
      x-security-type: USER_DATA
      x-signed: true
      parameters:
        - name: X-MBX-APIKEY
          in: header
          required: true
          description: 访问此接口需要 API Key，并且必须在请求头中携带。关于如何创建 API Key，请参考：[https://www.binance.com/cn/support/faq/detail/360002502072](https://www.binance.com/cn/support/faq/detail/360002502072)。
          schema:
            type: string
            example: API_KEY
        - name: recvWindow
          in: query
          required: false
          schema:
            type: integer
            example: 5000
            format: int64
            maximum: 60000
        - name: timestamp
          in: query
          required: true
          schema:
            type: integer
            example: 1770736694138
            format: int64
          description: 用于请求签名的 Unix 时间戳，单位为毫秒. 该值必须反映客户端当前时间，并会在签名接口中由服务器进行校验.
      responses:
        '200':
          description: 获取当前 持仓 Mode
          content:
            application/json:
              schema:
                type: object
                properties:
                  dualSidePosition:
                    type: boolean
                    example: true
                    description: 是否开启双向持仓模式.
    post:
      summary: 更改持仓模式 (TRADE)
      description: |-
        变换用户在 ***所有symbol*** 合约上的持仓模式：双向持仓或单向持仓。

        **迁移后**,UM 与 CM 共用**同一个** `dualSidePosition` 设置。调用此接口会同时翻转 UM 与 CM。任意一侧存在挂单或持仓时,切换会被拒绝:
        - `-4067`(存在挂单)
        - `-4068`(存在持仓)
      tags:
        - trade
      operationId: changePositionMode
      externalDocs:
        url: https://developers.binance.com/en/docs/catalog/core-trading-derivatives-trading-coin-m-futures/api/rest-api/trade#change-position-mode
      x-connectors-examples:
        ts: https://raw.githubusercontent.com/binance/binance-connector-js/master/clients/derivatives-trading-coin-futures/examples/rest-api/TradeApi/changePositionMode.ts
        rust: https://raw.githubusercontent.com/binance/binance-connector-rust/main/examples/derivatives_trading_coin_futures/rest_api/trade_api/change_position_mode.rs
        python: https://raw.githubusercontent.com/binance/binance-connector-python/master/clients/derivatives_trading_coin_futures/examples/rest_api/Trade/change_position_mode.py
        java: https://raw.githubusercontent.com/binance/binance-connector-java/master/examples/derivatives-trading-coin-futures/src/main/java/com/binance/connector/client/derivatives_trading_coin_futures/rest/trade/ChangePositionModeExample.java
        go: https://raw.githubusercontent.com/binance/binance-connector-go/main/clients/derivativestradingcoinfutures/examples/restapi/TradeAPI/ChangePositionMode/ChangePositionMode.go
        php: https://raw.githubusercontent.com/binance/binance-connector-php/master/examples/derivatives-trading-coin-futures/trade/ChangePositionModeExample.php
      x-ip-weight: 1
      x-security-type: TRADE
      x-signed: true
      parameters:
        - name: X-MBX-APIKEY
          in: header
          required: true
          description: 访问此接口需要 API Key，并且必须在请求头中携带。关于如何创建 API Key，请参考：[https://www.binance.com/cn/support/faq/detail/360002502072](https://www.binance.com/cn/support/faq/detail/360002502072)。
          schema:
            type: string
            example: API_KEY
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - dualSidePosition
                - timestamp
              properties:
                dualSidePosition:
                  type: string
                  example: 'true'
                  description: '"true": 双向持仓模式；"false": 单向持仓模式'
                recvWindow:
                  type: integer
                  example: 5000
                  format: int64
                  maximum: 60000
                timestamp:
                  type: integer
                  example: 1770736694138
                  format: int64
                  description: 用于请求签名的 Unix 时间戳，单位为毫秒. 该值必须反映客户端当前时间，并会在签名接口中由服务器进行校验.
      responses:
        '200':
          description: 修改持仓 Mode
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                    format: int64
                    description: API 响应码。"000000" 表示成功。
                  msg:
                    type: string
                    example: success
                    description: 消息详情.
  /dapi/v1/order/asyn:
    get:
      summary: 获取合约订单历史下载Id (USER_DATA)
      description: 获取合约订单历史下载Id
      tags:
        - account
      operationId: getDownloadIdForFuturesOrderHistory
      externalDocs:
        url: https://developers.binance.com/en/docs/catalog/core-trading-derivatives-trading-coin-m-futures/api/rest-api/account#get-download-id-for-futures-order-history
      x-connectors-examples:
        ts: https://raw.githubusercontent.com/binance/binance-connector-js/master/clients/derivatives-trading-coin-futures/examples/rest-api/AccountApi/getDownloadIdForFuturesOrderHistory.ts
        rust: https://raw.githubusercontent.com/binance/binance-connector-rust/main/examples/derivatives_trading_coin_futures/rest_api/account_api/get_download_id_for_futures_order_history.rs
        python: https://raw.githubusercontent.com/binance/binance-connector-python/master/clients/derivatives_trading_coin_futures/examples/rest_api/Account/get_download_id_for_futures_order_history.py
        java: https://raw.githubusercontent.com/binance/binance-connector-java/master/examples/derivatives-trading-coin-futures/src/main/java/com/binance/connector/client/derivatives_trading_coin_futures/rest/account/GetDownloadIdForFuturesOrderHistoryExample.java
        go: https://raw.githubusercontent.com/binance/binance-connector-go/main/clients/derivativestradingcoinfutures/examples/restapi/AccountAPI/GetDownloadIdForFuturesOrderHistory/GetDownloadIdForFuturesOrderHistory.go
        php: https://raw.githubusercontent.com/binance/binance-connector-php/master/examples/derivatives-trading-coin-futures/account/GetDownloadIdForFuturesOrderHistoryExample.php
      x-ip-weight: 1000
      x-security-type: USER_DATA
      x-signed: true
      parameters:
        - name: X-MBX-APIKEY
          in: header
          required: true
          description: 访问此接口需要 API Key，并且必须在请求头中携带。关于如何创建 API Key，请参考：[https://www.binance.com/cn/support/faq/detail/360002502072](https://www.binance.com/cn/support/faq/detail/360002502072)。
          schema:
            type: string
            example: API_KEY
        - name: startTime
          in: query
          required: true
          schema:
            type: integer
            example: 1623319461670
            format: int64
          description: 起始时间，ms格式时间戳
        - name: endTime
          in: query
          required: true
          schema:
            type: integer
            example: 1641782889000
            format: int64
          description: 结束时间，ms格式时间戳
        - name: recvWindow
          in: query
          required: false
          schema:
            type: integer
            example: 5000
            format: int64
            maximum: 60000
        - name: timestamp
          in: query
          required: true
          schema:
            type: integer
            example: 1770736694138
            format: int64
          description: 用于请求签名的 Unix 时间戳，单位为毫秒. 该值必须反映客户端当前时间，并会在签名接口中由服务器进行校验.
      x-parameters-notes: |-
        - 存在每月8次的请求限制，网页端和Rest接口下载次数共用。
        - 该接口走IP限流桶，每次消耗1000 weight。每分钟最多调用2次，第3次将触发封禁。
        - `startTime`与`endTime`间隔不能超过1年
      responses:
        '200':
          description: 获取Download ID 用于 合约 订单 历史
          content:
            application/json:
              schema:
                type: object
                properties:
                  avgCostTimestampOfLast30d:
                    type: integer
                    example: 7241837
                    format: int64
                    description: 过去30天平均数据下载时间
                  downloadId:
                    type: string
                    example: '546975389218332672'
                    description: 下载任务 ID.
  /dapi/v1/trade/asyn:
    get:
      summary: 获取合约交易历史下载Id (USER_DATA)
      description: 获取合约交易历史下载Id
      tags:
        - account
      operationId: getDownloadIdForFuturesTradeHistory
      externalDocs:
        url: https://developers.binance.com/en/docs/catalog/core-trading-derivatives-trading-coin-m-futures/api/rest-api/account#get-download-id-for-futures-trade-history
      x-connectors-examples:
        ts: https://raw.githubusercontent.com/binance/binance-connector-js/master/clients/derivatives-trading-coin-futures/examples/rest-api/AccountApi/getDownloadIdForFuturesTradeHistory.ts
        rust: https://raw.githubusercontent.com/binance/binance-connector-rust/main/examples/derivatives_trading_coin_futures/rest_api/account_api/get_download_id_for_futures_trade_history.rs
        python: https://raw.githubusercontent.com/binance/binance-connector-python/master/clients/derivatives_trading_coin_futures/examples/rest_api/Account/get_download_id_for_futures_trade_history.py
        java: https://raw.githubusercontent.com/binance/binance-connector-java/master/examples/derivatives-trading-coin-futures/src/main/java/com/binance/connector/client/derivatives_trading_coin_futures/rest/account/GetDownloadIdForFuturesTradeHistoryExample.java
