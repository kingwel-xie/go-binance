openapi: 3.0.2
info:
  title: Options REST API
  description: 访问市场数据、管理账户，并交易 Binance 期权。
  version: 1.0.0
  termsOfService: https://www.binance.com/en/terms
  contact:
    name: Binance API Support
    url: https://www.binance.com/en/support
x-product-type: rest-api
x-rate-limits-guide: products/derivatives-trading-options/general-info#访问限制
x-security-guide: products/derivatives-trading-options/general-info#接口鉴权类型
x-api-key-guide: https://www.binance.com/cn/support/faq/detail/360002502072
externalDocs:
  description: Options docs
  url: https://developers.binance.com/en/docs/products/derivatives-trading-options/general-info
tags:
  - name: account
    x-displayName: 账户接口
  - name: market-maker-block-trade
    x-displayName: 大宗交易
  - name: market-data
    x-displayName: 行情接口
  - name: market-maker-endpoints
    x-displayName: 做市商接口
  - name: trade
    x-displayName: 交易接口
  - name: user-data-streams
    x-displayName: Websocket账户信息推送
servers:
  - url: https://eapi.binance.com
  - url: https://testnet.binancefuture.com
paths:
  /eapi/v1/bill:
    get:
      summary: 获取账户资金流水 (USER_DATA)
      description: 获取期权账户资金流水
      tags:
        - account
      operationId: accountFundingFlow
      externalDocs:
        url: https://developers.binance.com/en/docs/catalog/core-trading-derivatives-trading-options/api/rest-api/account#account-funding-flow
      x-connectors-examples:
        ts: https://raw.githubusercontent.com/binance/binance-connector-js/master/clients/derivatives-trading-options/examples/rest-api/AccountApi/accountFundingFlow.ts
        rust: https://raw.githubusercontent.com/binance/binance-connector-rust/main/examples/derivatives_trading_options/rest_api/account_api/account_funding_flow.rs
        python: https://raw.githubusercontent.com/binance/binance-connector-python/master/clients/derivatives_trading_options/examples/rest_api/Account/account_funding_flow.py
        java: https://raw.githubusercontent.com/binance/binance-connector-java/master/examples/derivatives-trading-options/src/main/java/com/binance/connector/client/derivatives_trading_options/rest/account/AccountFundingFlowExample.java
        go: https://raw.githubusercontent.com/binance/binance-connector-go/main/clients/derivativestradingoptions/examples/restapi/AccountAPI/AccountFundingFlow/AccountFundingFlow.go
        php: https://raw.githubusercontent.com/binance/binance-connector-php/master/examples/derivatives-trading-options/account/AccountFundingFlowExample.php
      x-ip-weight: 1
      x-security-type: USER_DATA
      x-signed: true
      parameters:
        - name: X-MBX-APIKEY
          in: header
          required: true
          description: 访问此接口需要 API Key，并且必须在请求头中携带。关于如何创建 API Key，请参考：[https://www.binance.com/cn/support/faq/detail/360002502072](https://www.binance.com/cn/support/faq/detail/360002502072)。
          schema:
            type: string
            example: API_KEY
        - name: currency
          in: query
          required: true
          schema:
            type: string
            example: USDT
            enum:
              - USDT
          description: 资产类型目前仅支持USDT
        - name: recordId
          in: query
          required: false
          schema:
            type: integer
            example: 100000
            format: int64
          description: 返回该`recordId`及之后的成交，缺省返回最近的成交
        - name: startTime
          in: query
          required: false
          schema:
            type: integer
            example: 1623319461670
            format: int64
          description: 起始时间如1593511200000
        - name: endTime
          in: query
          required: false
          schema:
            type: integer
            example: 1641782889000
            format: int64
          description: 结束时间如1593512200000
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            example: 20
            default: 100
            maximum: 1000
            format: int64
          description: 返回结果集数量
        - name: recvWindow
          in: query
          required: false
          schema:
            type: integer
            example: 5000
            format: int64
          description: 接收窗口。
        - name: timestamp
          in: query
          required: true
          schema:
            type: integer
            example: 1770736694138
            format: int64
          description: 用于请求签名的 Unix 时间戳，单位为毫秒. 该值必须反映客户端当前时间，并会在签名接口中由服务器进行校验.
      x-parameters-notes: '- 仅支持查询最近3个月的数据'
      responses:
        '200':
          description: 账户 Funding Flow
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      example: 1125899906842624000
                      format: int64
                      description: ID
                    asset:
                      type: string
                      example: USDT
                      description: 资产类型
                    amount:
                      type: string
                      example: '-0.552'
                      description: 数量 (正数为流入，负数为流出)
                    type:
                      type: string
                      example: FEE
                      description: 类型 (手续费)
                    createDate:
                      type: integer
                      example: 1592449456000
                      format: int64
                      description: 时间
  /eapi/v1/marginAccount:
    get:
      summary: 保证金账户信息 (USER_DATA)
      description: 获取保证金账户信息
      tags:
        - account
      operationId: optionMarginAccountInformation
      externalDocs:
        url: https://developers.binance.com/en/docs/catalog/core-trading-derivatives-trading-options/api/rest-api/account#option-margin-account-information
      x-connectors-examples:
        ts: https://raw.githubusercontent.com/binance/binance-connector-js/master/clients/derivatives-trading-options/examples/rest-api/AccountApi/optionMarginAccountInformation.ts
        rust: https://raw.githubusercontent.com/binance/binance-connector-rust/main/examples/derivatives_trading_options/rest_api/account_api/option_margin_account_information.rs
        python: https://raw.githubusercontent.com/binance/binance-connector-python/master/clients/derivatives_trading_options/examples/rest_api/Account/option_margin_account_information.py
        java: https://raw.githubusercontent.com/binance/binance-connector-java/master/examples/derivatives-trading-options/src/main/java/com/binance/connector/client/derivatives_trading_options/rest/account/OptionMarginAccountInformationExample.java
        go: https://raw.githubusercontent.com/binance/binance-connector-go/main/clients/derivativestradingoptions/examples/restapi/AccountAPI/OptionMarginAccountInformation/OptionMarginAccountInformation.go
        php: https://raw.githubusercontent.com/binance/binance-connector-php/master/examples/derivatives-trading-options/account/OptionMarginAccountInformationExample.php
      x-ip-weight: 3
      x-security-type: USER_DATA
      x-signed: true
      parameters:
        - name: X-MBX-APIKEY
          in: header
          required: true
          description: 访问此接口需要 API Key，并且必须在请求头中携带。关于如何创建 API Key，请参考：[https://www.binance.com/cn/support/faq/detail/360002502072](https://www.binance.com/cn/support/faq/detail/360002502072)。
          schema:
            type: string
            example: API_KEY
        - name: recvWindow
          in: query
          required: false
          schema:
            type: integer
            example: 5000
            format: int64
          description: 接收窗口。
        - name: timestamp
          in: query
          required: true
          schema:
            type: integer
            example: 1770736694138
            format: int64
          description: 用于请求签名的 Unix 时间戳，单位为毫秒. 该值必须反映客户端当前时间，并会在签名接口中由服务器进行校验.
      responses:
        '200':
          description: Option 杠杆 账户 信息
          content:
            application/json:
              schema:
                type: object
                properties:
                  asset:
                    type: array
                    items:
                      type: object
                      properties:
                        asset:
                          type: string
                          example: USDT
                          description: 资产
                        marginBalance:
                          type: string
                          example: '10099.448'
                          description: 账户余额
                        equity:
                          type: string
                          example: '10094.44662'
                          description: 账户权益
                        available:
                          type: string
                          example: '8725.92524'
                          description: 账户可用
                        initialMargin:
                          type: string
                          example: '1084.52138'
                          description: 初始保证金
                        maintMargin:
                          type: string
                          example: '151.00138'
                          description: 维持保证金
                        unrealizedPNL:
                          type: string
                          example: '-5.00138'
                          description: 未实现盈亏
                        adjustedEquity:
                          type: string
                          example: '34.13282285'
                          description: margin balance + BTC多仓价值
                    description: 资产
                  greek:
                    type: array
                    items:
                      type: object
                      properties:
                        underlying:
                          type: string
                          example: BTCUSDT
                          description: 标的资产
                        delta:
                          type: string
                          example: '-0.05'
                          description: Delta
                        gamma:
                          type: string
                          example: '-0.002'
                          description: Gamma
                        theta:
                          type: string
                          example: '-0.05'
                          description: Theta
                        vega:
                          type: string
                          example: '-0.002'
                          description: Vega
                    description: greek
                  time:
                    type: integer
                    example: 1762843368098
                    format: int64
                    description: 时间
                  canTrade:
                    type: boolean
                    example: true
                    description: 是否可交易
                  canDeposit:
                    type: boolean
                    example: true
                    description: 是否可入金
                  canWithdraw:
                    type: boolean
                    example: true
                    description: 是否可出金
                  reduceOnly:
                    type: boolean
                    example: false
                    description: 仅减仓
                  tradeGroupId:
                    type: integer
                    example: -1
                    format: int64
                    description: 交易组 ID
  /eapi/v1/time:
    get:
      summary: 获取服务器时间
      description: 获取服务器时间
      tags:
        - market-data
      operationId: checkServerTime
      externalDocs:
        url: https://developers.binance.com/en/docs/catalog/core-trading-derivatives-trading-options/api/rest-api/market-data#check-server-time
      x-connectors-examples:
        ts: https://raw.githubusercontent.com/binance/binance-connector-js/master/clients/derivatives-trading-options/examples/rest-api/MarketDataApi/checkServerTime.ts
        rust: https://raw.githubusercontent.com/binance/binance-connector-rust/main/examples/derivatives_trading_options/rest_api/market_data_api/check_server_time.rs
        python: https://raw.githubusercontent.com/binance/binance-connector-python/master/clients/derivatives_trading_options/examples/rest_api/MarketData/check_server_time.py
        java: https://raw.githubusercontent.com/binance/binance-connector-java/master/examples/derivatives-trading-options/src/main/java/com/binance/connector/client/derivatives_trading_options/rest/marketdata/CheckServerTimeExample.java
        go: https://raw.githubusercontent.com/binance/binance-connector-go/main/clients/derivativestradingoptions/examples/restapi/MarketDataAPI/CheckServerTime/CheckServerTime.go
        php: https://raw.githubusercontent.com/binance/binance-connector-php/master/examples/derivatives-trading-options/marketdata/CheckServerTimeExample.php
      x-ip-weight: 1
      parameters: []
      responses:
        '200':
          description: 检查Server 时间
          content:
            application/json:
              schema:
                type: object
                properties:
                  serverTime:
                    type: integer
                    example: 1592387156596
                    format: int64
                    description: 当前的系统时间
  /eapi/v1/exchangeInfo:
    get:
      summary: 获取交易规则和交易对
      description: 获取交易规则和交易对
      tags:
        - market-data
      operationId: exchangeInformation
      externalDocs:
        url: https://developers.binance.com/en/docs/catalog/core-trading-derivatives-trading-options/api/rest-api/market-data#exchange-information
      x-connectors-examples:
        ts: https://raw.githubusercontent.com/binance/binance-connector-js/master/clients/derivatives-trading-options/examples/rest-api/MarketDataApi/exchangeInformation.ts
        rust: https://raw.githubusercontent.com/binance/binance-connector-rust/main/examples/derivatives_trading_options/rest_api/market_data_api/exchange_information.rs
        python: https://raw.githubusercontent.com/binance/binance-connector-python/master/clients/derivatives_trading_options/examples/rest_api/MarketData/exchange_information.py
        java: https://raw.githubusercontent.com/binance/binance-connector-java/master/examples/derivatives-trading-options/src/main/java/com/binance/connector/client/derivatives_trading_options/rest/marketdata/ExchangeInformationExample.java
        go: https://raw.githubusercontent.com/binance/binance-connector-go/main/clients/derivativestradingoptions/examples/restapi/MarketDataAPI/ExchangeInformation/ExchangeInformation.go
        php: https://raw.githubusercontent.com/binance/binance-connector-php/master/examples/derivatives-trading-options/marketdata/ExchangeInformationExample.php
      x-ip-weight: 1
      parameters: []
      responses:
        '200':
          description: Exchange 信息
          content:
            application/json:
              schema:
                type: object
                properties:
                  timezone:
                    type: string
                    example: UTC
                    description: 服务器时区
                  serverTime:
                    type: integer
                    example: 1592387337630
                    format: int64
                    description: 请忽略。如果需要获取当前系统时间，请查询接口 “GET /eapi/v1/time”
                  optionContracts:
                    type: array
                    items:
                      type: object
                      properties:
                        baseAsset:
                          type: string
                          example: BTC
                          description: 标的资产
                        quoteAsset:
                          type: string
                          example: USDT
                          description: 报价资产
                        underlying:
                          type: string
                          example: BTCUSDT
                          description: 期权合约底层资产
                        settleAsset:
                          type: string
                          example: USDT
                          description: 结算资产
                    description: 期权合约底层资产信息
                  optionAssets:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          example: USDT
                          description: 资产名
                    description: 期权系统支持资产
                  optionSymbols:
                    type: array
                    items:
                      type: object
                      properties:
                        expiryDate:
                          type: integer
                          example: 1660521600000
                          format: int64
                          description: 到期时间
                        filters:
                          type: array
                          items:
                            type: object
                            properties:
                              filterType:
                                type: string
                                example: PRICE_FILTER
                                description: filter Type
                              minPrice:
                                type: string
                                example: '0.02'
                                description: 最小价格
                              maxPrice:
                                type: string
                                example: '80000.01'
                                description: 最大价格
                              tickSize:
                                type: string
                                example: '0.01'
                                description: 最小价格精度
                              minQty:
                                type: string
                                example: '0.01'
                                description: 最小下单数量
                              maxQty:
                                type: string
                                example: '100'
                                description: 最大下单数量
                              stepSize:
                                type: string
                                example: '0.01'
                                description: 数量步长
                          description: filters
                        symbol:
                          type: string
                          example: BTC-220815-50000-C
                          description: 交易对
                        side:
                          type: string
                          example: CALL
                          description: 期权方向
                        strikePrice:
                          type: string
                          example: '50000'
                          description: 行权价
                        underlying:
                          type: string
                          example: BTCUSDT
                          description: 期权合约底层资产
                        unit:
                          type: integer
                          example: 1
                          format: int64
                          description: 合约单位, 单一合约代表的底层资产数量
                        liquidationFeeRate:
                          type: string
                          example: '0.0019000'
                          description: 爆仓手续费
                        minQty:
                          type: string
                          example: '0.01'
                          description: 最小下单数量
                        maxQty:
                          type: string
                          example: '100'
                          description: 最大下单数量
                        initialMargin:
                          type: string
                          example: '0.15'
                          description: 初始保证金率
                        maintenanceMargin:
                          type: string
                          example: '0.075'
                          description: 维持保证金率
                        minInitialMargin:
                          type: string
                          example: '0.1'
                          description: 最低初始保证金率
                        minMaintenanceMargin:
                          type: string
                          example: '0.05'
                          description: 最低维持保证金率
                        priceScale:
                          type: integer
                          example: 2
                          format: int64
                          description: 价格精度
                        quantityScale:
                          type: integer
                          example: 2
                          format: int64
                          description: 数量精度
                        quoteAsset:
                          type: string
                          example: USDT
                          description: 报价资产
                        contractType:
                          type: string
                          example: CRYPTO_OPTIONS
                          description: 合约类型
                        underlyingType:
                          type: string
                          example: CRYPTO
                          description: 标的类型
                        nakedSell:
                          type: boolean
                          example: false
                          description: 是否允许该交易对进行裸卖空
                        status:
                          type: string
                          example: TRADING
                          description: 状态
                    description: 期权交易对信息
                  rateLimits:
                    type: array
                    items:
                      type: object
                      properties:
                        rateLimitType:
                          type: string
                          example: REQUEST_WEIGHT
                          description: 限频类型
                        interval:
                          type: string
                          example: MINUTE
                          description: 时间区间
                        intervalNum:
                          type: integer
                          example: 1
                          format: int64
                          description: 区间数量
                        limit:
                          type: integer
                          example: 2400
                          format: int64
                          description: 限制值
                    description: rate Limits
  /eapi/v1/exerciseHistory:
    get:
      summary: 历史行权记录
      description: |-
        查询行权记录

        * REALISTIC_VALUE_STRICKEN 行权
        * EXTRINSIC_VALUE_EXPIRED 未行权
      tags:
        - market-data
      operationId: historicalExerciseRecords
      externalDocs:
        url: https://developers.binance.com/en/docs/catalog/core-trading-derivatives-trading-options/api/rest-api/market-data#historical-exercise-records
      x-connectors-examples:
        ts: https://raw.githubusercontent.com/binance/binance-connector-js/master/clients/derivatives-trading-options/examples/rest-api/MarketDataApi/historicalExerciseRecords.ts
        rust: https://raw.githubusercontent.com/binance/binance-connector-rust/main/examples/derivatives_trading_options/rest_api/market_data_api/historical_exercise_records.rs
        python: https://raw.githubusercontent.com/binance/binance-connector-python/master/clients/derivatives_trading_options/examples/rest_api/MarketData/historical_exercise_records.py
        java: https://raw.githubusercontent.com/binance/binance-connector-java/master/examples/derivatives-trading-options/src/main/java/com/binance/connector/client/derivatives_trading_options/rest/marketdata/HistoricalExerciseRecordsExample.java
        go: https://raw.githubusercontent.com/binance/binance-connector-go/main/clients/derivativestradingoptions/examples/restapi/MarketDataAPI/HistoricalExerciseRecords/HistoricalExerciseRecords.go
        php: https://raw.githubusercontent.com/binance/binance-connector-php/master/examples/derivatives-trading-options/marketdata/HistoricalExerciseRecordsExample.php
      x-ip-weight: 3
      parameters:
        - name: underlying
          in: query
          required: false
          schema:
            type: string
            example: BTCUSDT
          description: 标的资产。
        - name: startTime
          in: query
          required: false
          schema:
            type: integer
            example: 1623319461670
            format: int64
          description: 起始时间如1593511200000
        - name: endTime
          in: query
          required: false
          schema:
            type: integer
            example: 1641782889000
            format: int64
          description: 结束时间如1593512200000
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            example: 20
            default: 100
            maximum: 100
            format: int64
          description: 返回结果集数量，默认值100，最大值100
      responses:
        '200':
          description: 请参见英文说明：Historical Exercise Records
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    symbol:
                      type: string
                      example: BTC-220121-60000-P
                      description: 交易对
                    strikePrice:
                      type: string
                      example: '60000'
                      description: 行权价
                    realStrikePrice:
                      type: string
                      example: '38844.69652571'
                      description: 行权结算价格
                    expiryDate:
                      type: integer
                      example: 1642752000000
                      format: int64
                      description: 行权时间
                    strikeResult:
                      type: string
                      example: REALISTIC_VALUE_STRICKEN
                      description: 行权结果
  /eapi/v1/index:
    get:
      summary: 标的指数价格
      description: 返回指数价格
      tags:
        - market-data
      operationId: indexPrice
      externalDocs:
        url: https://developers.binance.com/en/docs/catalog/core-trading-derivatives-trading-options/api/rest-api/market-data#index-price
      x-connectors-examples:
        ts: https://raw.githubusercontent.com/binance/binance-connector-js/master/clients/derivatives-trading-options/examples/rest-api/MarketDataApi/indexPrice.ts
        rust: https://raw.githubusercontent.com/binance/binance-connector-rust/main/examples/derivatives_trading_options/rest_api/market_data_api/index_price.rs
        python: https://raw.githubusercontent.com/binance/binance-connector-python/master/clients/derivatives_trading_options/examples/rest_api/MarketData/index_price.py
        java: https://raw.githubusercontent.com/binance/binance-connector-java/master/examples/derivatives-trading-options/src/main/java/com/binance/connector/client/derivatives_trading_options/rest/marketdata/IndexPriceExample.java
        go: https://raw.githubusercontent.com/binance/binance-connector-go/main/clients/derivativestradingoptions/examples/restapi/MarketDataAPI/IndexPrice/IndexPrice.go
        php: https://raw.githubusercontent.com/binance/binance-connector-php/master/examples/derivatives-trading-options/marketdata/IndexPriceExample.php
      x-ip-weight: 1
      parameters:
        - name: underlying
          in: query
          required: true
          schema:
            type: string
            example: BTCUSDT
          description: 标的资产。
      responses:
        '200':
          description: Index 价格
          content:
            application/json:
              schema:
                type: object
                properties:
                  time:
                    type: integer
                    example: 1656647305000
                    format: int64
                    description: 时间
                  indexPrice:
                    type: string
                    example: '105917.75'
                    description: 指数价格
  /eapi/v1/klines:
    get:
      summary: K线数据
      description: K线数据，每根K线的开盘时间可视为唯一ID
      tags:
        - market-data
      operationId: klineCandlestickData
      externalDocs:
