  /eapi/v1/mmpSet:
    post:
      summary: 设置MMP规则 (TRADE)
      description: 设置MMP参数。 做市商保护(Market Maker Protection) 是一种为期权做市商设计的保护机制，该机制能够防止做市商的订单在短时间大量成交。一旦某个账户在短时间内的总交易额超过了配置的限额，该账户的做市商保护将被触发。当做市商保护被触发时，账户现有的做市商保护订单（被标记为做市商保护的订单）将被撮合自动取消，而该账户新的做市商保护订单将在冻结期被拒绝。用户可以利用这段时间重新评估行情并修改报价。
      tags:
        - market-maker-endpoints
      operationId: setMarketMakerProtectionConfig
      externalDocs:
