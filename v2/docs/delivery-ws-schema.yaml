  /order.cancel:
    post:
      summary: 撤销订单 (TRADE)
      description: 撤销订单
      tags:
        - trade
      operationId: cancelOrder
      externalDocs:
        url: https://developers.binance.com/en/docs/catalog/core-trading-derivatives-trading-coin-m-futures/api/ws-api/trade#cancel-order
      x-connectors-examples:
        ts: https://raw.githubusercontent.com/binance/binance-connector-js/master/clients/derivatives-trading-coin-futures/examples/websocket-api/TradeApi/cancelOrder.ts
        rust: https://raw.githubusercontent.com/binance/binance-connector-rust/main/examples/derivatives_trading_coin_futures/websocket_api/trade_api/cancel_order.rs
        python: https://raw.githubusercontent.com/binance/binance-connector-python/master/clients/derivatives_trading_coin_futures/examples/websocket_api/Trade/cancel_order.py
        java: https://raw.githubusercontent.com/binance/binance-connector-java/master/examples/derivatives-trading-coin-futures/src/main/java/com/binance/connector/client/derivatives_trading_coin_futures/websocket/api/trade/CancelOrderExample.java
        go: https://raw.githubusercontent.com/binance/binance-connector-go/main/clients/derivativestradingcoinfutures/examples/websocketapi/TradeAPI/CancelOrder/CancelOrder.go
      x-ip-weight: 1
      x-security-type: TRADE
      x-signed: true
      x-parameters-notes: '- `orderId` 或 `origClientOrderId` 至少需要发送一个。'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  example: e9d6b4349871b40611412680b3445fac
                method:
                  type: string
                  description: WebSocket API 方法名称。
                  enum:
                    - order.cancel
                  example: order.cancel
                params:
                  type: object
                  properties:
                    symbol:
                      type: string
                      example: BTCUSD_PERP
                    orderId:
                      type: integer
                      example: 1
                      format: int64
                    origClientOrderId:
                      type: string
                      example: '1'
                    recvWindow:
                      type: integer
                      example: 5000
                      format: int64
                      maximum: 60000
                    timestamp:
                      type: integer
                      example: 1770736694138
                      format: int64
                      description: 用于请求签名的 Unix 时间戳，单位为毫秒. 该值必须反映客户端当前时间，并会在签名接口中由服务器进行校验.
                    apiKey:
                      type: string
                      description: 访问此接口需要 API Key，并且必须在请求头中携带。关于如何创建 API Key，请参考：[https://www.binance.com/cn/support/faq/detail/360002502072](https://www.binance.com/cn/support/faq/detail/360002502072)。
                      example: API_KEY
                  additionalProperties: false
                  required:
                    - symbol
                    - timestamp
                    - apiKey
              required:
                - id
                - method
                - params
              additionalProperties: false
            example:
              id: e9d6b4349871b40611412680b3445fac
              method: order.cancel
              params:
                symbol: BTCUSD_PERP
                orderId: 1
                origClientOrderId: '1'
                recvWindow: 5000
                timestamp: 1770736694138
                apiKey: API_KEY
      responses:
        Successful Response:
          description: 取消订单
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: a8627ea5-8b9f-452f-90ae-4136f2b442e2
                    description: 持仓 ID
                  status:
                    type: integer
                    example: 200
                    format: int64
                  result:
                    type: object
                    properties:
                      orderId:
                        type: integer
                        example: 333245211
