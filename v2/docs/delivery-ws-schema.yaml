                        description: 止损触发价格类型.
                      priceProtect:
                        type: boolean
                        example: false
                        description: 是否开启条件单触发保护
                      origType:
                        type: string
                        example: LIMIT
                        description: 原始订单类型.
                      updateTime:
                        type: integer
                        example: 1728416138285
                        format: int64
                        description: 更新时间
                    description: Indicates that combined is set to true.
                  rateLimits:
                    type: array
                    items:
                      type: object
                      properties:
                        rateLimitType:
                          type: string
                          example: REQUEST_WEIGHT
                          description: 频率限制类型.
                        interval:
                          type: string
                          example: MINUTE
                          description: 频率限制区间.
                        intervalNum:
                          type: integer
                          example: 1
                          format: int64
                          description: 频率限制区间倍数.
                        limit:
                          type: integer
                          example: 2400
                          format: int64
                          description: 该规则允许的最大订单数。
                        count:
                          type: integer
                          example: 6
                          format: int64
                          description: 24 小时窗口内成交总笔数。
                    description: 频率限制定义.
  /order.modify:
    post:
      summary: 修改订单 (TRADE)
      description: 修改订单功能，当前只支持限价（LIMIT）订单修改，修改后会在撮合队列里重新排序
      tags:
        - trade
      operationId: modifyOrder
      externalDocs:
        url: https://developers.binance.com/en/docs/catalog/core-trading-derivatives-trading-coin-m-futures/api/ws-api/trade#modify-order
      x-connectors-examples:
        ts: https://raw.githubusercontent.com/binance/binance-connector-js/master/clients/derivatives-trading-coin-futures/examples/websocket-api/TradeApi/modifyOrder.ts
        rust: https://raw.githubusercontent.com/binance/binance-connector-rust/main/examples/derivatives_trading_coin_futures/websocket_api/trade_api/modify_order.rs
        python: https://raw.githubusercontent.com/binance/binance-connector-python/master/clients/derivatives_trading_coin_futures/examples/websocket_api/Trade/modify_order.py
        java: https://raw.githubusercontent.com/binance/binance-connector-java/master/examples/derivatives-trading-coin-futures/src/main/java/com/binance/connector/client/derivatives_trading_coin_futures/websocket/api/trade/ModifyOrderExample.java
        go: https://raw.githubusercontent.com/binance/binance-connector-go/main/clients/derivativestradingcoinfutures/examples/websocketapi/TradeAPI/ModifyOrder/ModifyOrder.go
      x-security-type: TRADE
      x-signed: true
      x-weight: |-
        1 on 10s order rate limit(X-MBX-ORDER-COUNT-10S);
        1 on 1min order rate limit(X-MBX-ORDER-COUNT-1M);
        1 on IP rate limit(x-mbx-used-weight-1m)
      x-parameters-notes: |-
        - 必须发送 `orderId` 或 `origClientOrderId` 其中之一，如果两个都发送，`orderId` 优先。
        - `quantity` 和 `price` 必须同时发送。
        - 当新的 `quantity` 或 `price` 不满足 `PRICE_FILTER` / `PERCENT_FILTER` / `LOT_SIZE` 时，修改将被拒绝，订单保持不变。
        - 但在以下情况下，订单将被修改操作取消：
          - 当订单处于部分成交状态且新的 `quantity` <= `executedQty` 时
