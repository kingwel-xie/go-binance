openapi: 3.0.2
info:
  title: Futures (COIN-M) WebSocket API
  description: 访问市场数据、管理账户，并交易 COIN-M 永续合约和交割合约。
  version: 1.0.0
  termsOfService: https://www.binance.com/en/terms
  contact:
    name: Binance API Support
    url: https://www.binance.com/en/support
x-product-type: ws-api
x-rate-limits-guide: products/derivatives-trading-coin-futures/general-info#访问限制
x-security-guide: products/derivatives-trading-coin-futures/general-info#接口鉴权类型
x-api-key-guide: https://www.binance.com/cn/support/faq/detail/360002502072
externalDocs:
  description: Futures (COIN-M) docs
  url: https://developers.binance.com/en/docs/products/derivatives-trading-coin-futures/general-info
tags:
  - name: account
    x-displayName: 账户接口
  - name: trade
    x-displayName: 交易接口
  - name: user-data-streams
    x-displayName: Websocket账户信息推送
servers:
  - url: wss://ws-dapi.binance.com/ws-dapi/v1
  - url: wss://testnet.binancefuture.com/ws-dapi/v1
paths:
  /account.status:
    post:
      summary: 账户信息 (USER_DATA)
      description: 现有账户信息。
      tags:
        - account
      operationId: accountInformation
      externalDocs:
        url: https://developers.binance.com/en/docs/catalog/core-trading-derivatives-trading-coin-m-futures/api/ws-api/account#account-information
      x-connectors-examples:
        ts: https://raw.githubusercontent.com/binance/binance-connector-js/master/clients/derivatives-trading-coin-futures/examples/websocket-api/AccountApi/accountInformation.ts
        rust: https://raw.githubusercontent.com/binance/binance-connector-rust/main/examples/derivatives_trading_coin_futures/websocket_api/account_api/account_information.rs
        python: https://raw.githubusercontent.com/binance/binance-connector-python/master/clients/derivatives_trading_coin_futures/examples/websocket_api/Account/account_information.py
        java: https://raw.githubusercontent.com/binance/binance-connector-java/master/examples/derivatives-trading-coin-futures/src/main/java/com/binance/connector/client/derivatives_trading_coin_futures/websocket/api/account/AccountInformationExample.java
        go: https://raw.githubusercontent.com/binance/binance-connector-go/main/clients/derivativestradingcoinfutures/examples/websocketapi/AccountAPI/AccountInformation/AccountInformation.go
      x-ip-weight: 5
      x-security-type: USER_DATA
      x-signed: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  example: e9d6b4349871b40611412680b3445fac
                method:
                  type: string
                  description: WebSocket API 方法名称。
                  enum:
                    - account.status
                  example: account.status
                params:
                  type: object
                  properties:
                    recvWindow:
                      type: integer
                      example: 5000
                      format: int64
                      maximum: 60000
                    timestamp:
                      type: integer
                      example: 1770736694138
                      format: int64
                      description: 用于请求签名的 Unix 时间戳，单位为毫秒. 该值必须反映客户端当前时间，并会在签名接口中由服务器进行校验.
                    apiKey:
                      type: string
                      description: 访问此接口需要 API Key，并且必须在请求头中携带。关于如何创建 API Key，请参考：[https://www.binance.com/cn/support/faq/detail/360002502072](https://www.binance.com/cn/support/faq/detail/360002502072)。
                      example: API_KEY
                  additionalProperties: false
                  required:
                    - timestamp
                    - apiKey
              required:
                - id
                - method
                - params
              additionalProperties: false
            example:
              id: e9d6b4349871b40611412680b3445fac
              method: account.status
              params:
                recvWindow: 5000
                timestamp: 1770736694138
                apiKey: API_KEY
      responses:
        Successful Response:
          description: 账户 信息
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: baaec739-c5cf-4920-b448-c0b9c5431410
                    description: 持仓 ID
                  status:
                    type: integer
                    example: 200
                    format: int64
                  result:
                    type: object
                    properties:
                      feeTier:
                        type: integer
                        example: 0
                        format: int64
                        description: 手续费等级.
                      canTrade:
                        type: boolean
                        example: true
                        description: 是否可交易.
                      canDeposit:
                        type: boolean
                        example: true
                        description: 是否可充值.
                      canWithdraw:
                        type: boolean
                        example: true
                        description: 是否可提现.
                      updateTime:
                        type: integer
                        example: 0
                        format: int64
                        description: 更新时间
                      assets:
                        type: array
                        items:
                          type: object
                          properties:
                            asset:
                              type: string
                              example: WLD
                              description: 资产
                            walletBalance:
                              type: string
                              example: '0.00000000'
                              description: 账户余额
                            unrealizedProfit:
                              type: string
                              example: '0.00000000'
                              description: 全部持仓未实现盈亏
                            marginBalance:
                              type: string
                              example: '0.00000000'
                              description: 保证金余额
                            maintMargin:
                              type: string
                              example: '0.00000000'
                              description: 维持保证金
                            initialMargin:
                              type: string
                              example: '0.00000000'
                              description: 当前所需起始保证金(按最新标标记价格)
                            positionInitialMargin:
                              type: string
                              example: '0.00000000'
                              description: 当前所需持仓起始保证金(按最新标标记价格)
                            openOrderInitialMargin:
                              type: string
                              example: '0.00000000'
                              description: 当前所需挂单起始保证金(按最新标标记价格)
                            maxWithdrawAmount:
                              type: string
                              example: '0.00000000'
                              description: 最大可转出余额
                            crossWalletBalance:
                              type: string
                              example: '0.00000000'
                              description: 可用于全仓的账户余额
                            crossUnPnl:
                              type: string
                              example: '0.00000000'
                              description: 所有全仓持仓的未实现盈亏
                            availableBalance:
                              type: string
                              example: '0.00000000'
                              description: 可用下单余额
                            updateTime:
                              type: integer
                              example: 0
                              format: int64
                              description: 更新时间
                        description: 支持的资产列表。
                      positions:
                        type: array
                        items:
                          type: object
                          properties:
                            symbol:
                              type: string
                              example: ETHUSD_220930
                              description: 交易对
                            initialMargin:
                              type: string
                              example: '0'
                              description: 当前所需起始保证金(按最新标标记价格)
                            maintMargin:
                              type: string
                              example: '0'
                              description: 维持保证金
                            unrealizedProfit:
                              type: string
                              example: '0.00000000'
                              description: 全部持仓未实现盈亏
                            positionInitialMargin:
                              type: string
                              example: '0'
                              description: 当前所需持仓起始保证金(按最新标标记价格)
                            openOrderInitialMargin:
                              type: string
                              example: '0'
                              description: 当前所需挂单起始保证金(按最新标标记价格)
                            leverage:
                              type: string
                              example: '7'
                              description: 杠杆倍数.
                            isolated:
                              type: boolean
                              example: false
                              description: 是否为逐仓模式.
                            positionSide:
                              type: string
                              example: BOTH
                              description: 持仓方向
                            entryPrice:
                              type: string
                              example: '0.00000000'
                              description: 持仓开仓价格.
                            maxQty:
                              type: string
                              example: '1000'
                              description: 数量上限, 最大数量
                            notionalValue:
                              type: string
                              example: '0'
                              description: 名义价值.
                            isolatedWallet:
                              type: string
                              example: '0'
                              description: 逐仓钱包余额.
                            updateTime:
                              type: integer
                              example: 0
                              format: int64
                              description: 更新时间
                            positionAmt:
                              type: string
                              example: '0'
                              description: 持仓数量
                            breakEvenPrice:
                              type: string
                              example: '0.00000000'
                              description: 盈亏平衡价
                        description: 持仓列表.
                    description: Indicates that combined is set to true.
                  rateLimits:
                    type: array
                    items:
                      type: object
                      properties:
                        rateLimitType:
                          type: string
                          example: REQUEST_WEIGHT
                          description: 频率限制类型.
                        interval:
                          type: string
                          example: MINUTE
                          description: 频率限制区间.
                        intervalNum:
                          type: integer
                          example: 1
                          format: int64
                          description: 频率限制区间倍数.
                        limit:
                          type: integer
                          example: 2400
                          format: int64
                          description: 该规则允许的最大订单数。
                        count:
                          type: integer
                          example: 10
                          format: int64
                          description: 24 小时窗口内成交总笔数。
                    description: 频率限制定义.
