                    description: 买方
                  a:
                    type: array
                    items:
                      type: array
                      items:
                        type: string
                        example: '9524.6'
                    description: 卖方
                  st:
                    type: integer
                    example: 1
                    description: (迁移后新增) Symbol 类型:1 = UM,2 = CM
              example:
                e: depthUpdate
                E: 1591269996801
                T: 1591269996646
                s: BTCUSD_200626
                ps: BTCUSD
                U: 17276694
                u: 17276701
                pu: 17276678
                b:
                  - - '9523.0'
                a:
                  - - '9524.6'
                st: 1
        Combined Stream:
          description: Stream payload with stream name.
          content:
            application/json:
              schema:
                type: object
                properties:
                  stream:
                    type: string
                    example: btcusdt@depth10@100ms
                  data:
                    type: object
                    properties:
                      e:
                        type: string
                        example: depthUpdate
                        enum:
                          - depthUpdate
                        description: 事件类型
                      E:
                        type: integer
                        example: 1591269996801
                        format: int64
                        description: 事件时间
                      T:
                        type: integer
                        example: 1591269996646
                        format: int64
                        description: 撮合时间
                      s:
                        type: string
                        example: BTCUSD_200626
                        description: 交易对
                      ps:
                        type: string
                        example: BTCUSD
                        description: 标的交易对
                      U:
                        type: integer
                        example: 17276694
                        format: int64
                        description: 从上次推送至今新增的第一个 update Id
                      u:
                        type: integer
                        example: 17276701
                        format: int64
                        description: 更新 ID
                      pu:
                        type: integer
                        example: 17276678
                        format: int64
                        description: 上次推送的最后一个update Id(即上条消息的‘u’)
                      b:
                        type: array
                        items:
                          type: array
                          items:
                            type: string
                            example: '9523.0'
                        description: 买方
                      a:
                        type: array
                        items:
                          type: array
                          items:
                            type: string
                            example: '9524.6'
                        description: 卖方
                      st:
                        type: integer
                        example: 1
                        description: (迁移后新增) Symbol 类型:1 = UM,2 = CM
                required:
                  - stream
                  - data
                additionalProperties: false
              example:
                stream: btcusdt@depth10@100ms
                data:
                  e: depthUpdate
                  E: 1591269996801
                  T: 1591269996646
                  s: BTCUSD_200626
                  ps: BTCUSD
                  U: 17276694
                  u: 17276701
                  pu: 17276678
                  b:
                    - - '9523.0'
                  a:
                    - - '9524.6'
                  st: 1
