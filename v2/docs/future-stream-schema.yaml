        go: https://raw.githubusercontent.com/binance/binance-connector-go/main/clients/derivativestradingcoinfutures/examples/websocketstreams/WebsocketMarketStreamsAPI//AllMarketMiniTickersStream/AllMarketMiniTickersStream.go
      x-update-speed: 1000ms
      parameters:
        - name: id
          in: query
          required: false
          schema:
            type: string
            example: e9d6b4349871b40611412680b3445fac
          description: 唯一的 WebSocket 请求 ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                method:
                  type: string
                  description: WebSocket 数据流方法名称。
                  enum:
                    - SUBSCRIBE
                  example: SUBSCRIBE
                params:
                  type: array
                  items:
                    type: string
                  description: 要订阅的数据流列表。
                  example:
                    - '!miniTicker@arr'
                id:
                  type: string
                  example: e9d6b4349871b40611412680b3445fac
                  description: 唯一的 WebSocket 请求 ID。
              required:
                - method
                - params
                - id
              additionalProperties: false
            example:
              method: SUBSCRIBE
