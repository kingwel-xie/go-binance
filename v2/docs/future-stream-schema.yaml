openapi: 3.0.2
info:
  title: Futures (COIN-M) WebSocket Market Streams
  description: 访问市场数据、管理账户，并交易 COIN-M 永续合约和交割合约。
  version: 1.0.0
  termsOfService: https://www.binance.com/en/terms
  contact:
    name: Binance API Support
    url: https://www.binance.com/en/support
x-product-type: ws-streams
x-untagged-label: true
x-user-data-streams: true
externalDocs:
  description: Futures (COIN-M) docs
  url: https://developers.binance.com/en/docs/products/derivatives-trading-coin-futures/general-info
servers:
  - url: wss://dstream.binance.com
  - url: wss://dstream.binancefuture.com
paths:
  /{symbol}@aggTrade:
    post:
      summary: 归集交易
      description: |-
        归集成交流推送市场成交信息, 每100毫秒为一个时间窗口, 将同一价格和买卖方向的成交进行归集。

        > **迁移后**,payload 末尾新增 `st` 字段(`1` = UM,`2` = CM)。
      operationId: aggregateTradeStreams
      externalDocs:
        url: https://developers.binance.com/en/docs/catalog/core-trading-derivatives-trading-coin-m-futures/api/ws-streams/~#aggregate-trade-streams
      x-connectors-examples:
        ts: https://raw.githubusercontent.com/binance/binance-connector-js/master/clients/derivatives-trading-coin-futures/examples/websocket-streams//aggregateTradeStreams.ts
        rust: https://raw.githubusercontent.com/binance/binance-connector-rust/main/examples/derivatives_trading_coin_futures/websocket_streams//aggregate_trade_streams.rs
        python: https://raw.githubusercontent.com/binance/binance-connector-python/master/clients/derivatives_trading_coin_futures/examples/websocket_streams//aggregate_trade_streams.py
        java: https://raw.githubusercontent.com/binance/binance-connector-java/master/examples/derivatives-trading-coin-futures/src/main/java/com/binance/connector/client/derivatives_trading_coin_futures/websocket/stream/websocketmarketstreams//AggregateTradeStreamsExample.java
        go: https://raw.githubusercontent.com/binance/binance-connector-go/main/clients/derivativestradingcoinfutures/examples/websocketstreams/WebsocketMarketStreamsAPI//AggregateTradeStreams/AggregateTradeStreams.go
      x-update-speed: 100ms
      parameters:
        - name: id
          in: query
          required: false
          schema:
            type: string
            example: e9d6b4349871b40611412680b3445fac
          description: 唯一的 WebSocket 请求 ID.
        - name: symbol
          in: path
          required: true
          schema:
            type: string
            example: btcusdt
          description: 交易对参数
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                method:
                  type: string
                  description: WebSocket 数据流方法名称。
                  enum:
                    - SUBSCRIBE
                  example: SUBSCRIBE
                params:
                  type: array
                  items:
                    type: string
                  description: 要订阅的数据流列表。
                  example:
                    - btcusdt@aggTrade
                id:
                  type: string
                  example: e9d6b4349871b40611412680b3445fac
                  description: 唯一的 WebSocket 请求 ID。
              required:
                - method
                - params
                - id
              additionalProperties: false
            example:
              method: SUBSCRIBE
              params:
                - btcusdt@aggTrade
              id: e9d6b4349871b40611412680b3445fac
      responses:
        Raw Stream:
          description: 归集成交流
          content:
            application/json:
              schema:
                type: object
                properties:
                  e:
                    type: string
                    example: aggTrade
                    enum:
                      - aggTrade
                    description: 事件类型
                  E:
                    type: integer
                    example: 1591261134288
                    format: int64
                    description: 事件时间
                  a:
                    type: integer
                    example: 424951
                    format: int64
                    description: 归集成交ID
                  s:
                    type: string
                    example: BTCUSD_200626
                    description: 交易对
                  p:
                    type: string
                    example: '9643.5'
                    description: 成交价格
                  q:
                    type: string
                    example: '2'
                    description: 成交量
                  f:
                    type: integer
                    example: 606073
                    format: int64
                    description: 被归集的首个交易ID
                  l:
                    type: integer
                    example: 606073
                    format: int64
                    description: 被归集的末次交易ID
                  T:
                    type: integer
                    example: 1591261134199
                    format: int64
                    description: 成交时间
                  m:
                    type: boolean
                    example: false
                    description: 买方是否是做市方。如true,则此次成交是一个主动卖出单,否则是一个主动买入单。
                  st:
                    type: integer
                    example: 1
                    description: (迁移后新增) Symbol 类型:1 = UM,2 = CM
              example:
                e: aggTrade
                E: 1591261134288
                a: 424951
                s: BTCUSD_200626
                p: '9643.5'
                q: '2'
                f: 606073
                l: 606073
                T: 1591261134199
                m: false
                st: 1
        Combined Stream:
          description: Stream payload with stream name.
          content:
            application/json:
              schema:
                type: object
                properties:
                  stream:
                    type: string
                    example: btcusdt@aggTrade
                  data:
                    type: object
                    properties:
                      e:
                        type: string
                        example: aggTrade
                        enum:
                          - aggTrade
                        description: 事件类型
                      E:
                        type: integer
                        example: 1591261134288
                        format: int64
                        description: 事件时间
                      a:
                        type: integer
                        example: 424951
                        format: int64
                        description: 归集成交ID
                      s:
                        type: string
                        example: BTCUSD_200626
                        description: 交易对
                      p:
                        type: string
                        example: '9643.5'
                        description: 成交价格
                      q:
                        type: string
                        example: '2'
                        description: 成交量
                      f:
                        type: integer
                        example: 606073
                        format: int64
                        description: 被归集的首个交易ID
                      l:
                        type: integer
                        example: 606073
                        format: int64
                        description: 被归集的末次交易ID
                      T:
                        type: integer
                        example: 1591261134199
                        format: int64
                        description: 成交时间
                      m:
                        type: boolean
                        example: false
                        description: 买方是否是做市方。如true,则此次成交是一个主动卖出单,否则是一个主动买入单。
                      st:
                        type: integer
                        example: 1
                        description: (迁移后新增) Symbol 类型:1 = UM,2 = CM
                required:
                  - stream
                  - data
                additionalProperties: false
              example:
                stream: btcusdt@aggTrade
                data:
                  e: aggTrade
                  E: 1591261134288
                  a: 424951
                  s: BTCUSD_200626
                  p: '9643.5'
                  q: '2'
                  f: 606073
                  l: 606073
                  T: 1591261134199
                  m: false
                  st: 1
  /!bookTicker:
    post:
      summary: 全市场最优挂单信息
      description: |-
        实时推送所有交易对的最优挂单价格或数量的任何更新。

        > **迁移后**,此 stream 推送合并的 UM + CM universe(`fstream` 与 `dstream` 都可订阅);payload 末尾新增 `st` 字段(`1` = UM,`2` = CM)。
      operationId: allBookTickersStream
      externalDocs:
        url: https://developers.binance.com/en/docs/catalog/core-trading-derivatives-trading-coin-m-futures/api/ws-streams/~#all-book-tickers-stream
      x-connectors-examples:
        ts: https://raw.githubusercontent.com/binance/binance-connector-js/master/clients/derivatives-trading-coin-futures/examples/websocket-streams//allBookTickersStream.ts
        rust: https://raw.githubusercontent.com/binance/binance-connector-rust/main/examples/derivatives_trading_coin_futures/websocket_streams//all_book_tickers_stream.rs
        python: https://raw.githubusercontent.com/binance/binance-connector-python/master/clients/derivatives_trading_coin_futures/examples/websocket_streams//all_book_tickers_stream.py
        java: https://raw.githubusercontent.com/binance/binance-connector-java/master/examples/derivatives-trading-coin-futures/src/main/java/com/binance/connector/client/derivatives_trading_coin_futures/websocket/stream/websocketmarketstreams//AllBookTickersStreamExample.java
        go: https://raw.githubusercontent.com/binance/binance-connector-go/main/clients/derivativestradingcoinfutures/examples/websocketstreams/WebsocketMarketStreamsAPI//AllBookTickersStream/AllBookTickersStream.go
      x-update-speed: Real-time
      parameters:
        - name: id
          in: query
          required: false
          schema:
            type: string
            example: e9d6b4349871b40611412680b3445fac
          description: 唯一的 WebSocket 请求 ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                method:
                  type: string
                  description: WebSocket 数据流方法名称。
                  enum:
                    - SUBSCRIBE
                  example: SUBSCRIBE
                params:
                  type: array
                  items:
                    type: string
                  description: 要订阅的数据流列表。
                  example:
                    - '!bookTicker'
                id:
                  type: string
                  example: e9d6b4349871b40611412680b3445fac
                  description: 唯一的 WebSocket 请求 ID。
              required:
                - method
                - params
                - id
              additionalProperties: false
            example:
              method: SUBSCRIBE
              params:
                - '!bookTicker'
              id: e9d6b4349871b40611412680b3445fac
      responses:
        Raw Stream:
          description: 全市场最优挂单流
          content:
            application/json:
              schema:
                type: object
                properties:
                  e:
                    type: string
                    example: bookTicker
                    enum:
                      - bookTicker
                    description: 事件类型
                  u:
                    type: integer
                    example: 17242169
                    format: int64
                    description: 更新ID
                  s:
                    type: string
                    example: BTCUSD_200626
                    description: 交易对
                  b:
                    type: string
                    example: '9548.1'
                    description: 买单最优挂单价格
                  B:
                    type: string
                    example: '52'
                    description: 买单最优挂单数量
                  a:
                    type: string
                    example: '9548.5'
                    description: 卖单最优挂单价格
                  A:
                    type: string
                    example: '11'
                    description: 卖单最优挂单数量
                  T:
                    type: integer
                    example: 1591268628155
                    format: int64
                    description: 撮合时间
                  E:
                    type: integer
                    example: 1591268628166
                    format: int64
                    description: 事件时间
                  ps:
                    type: string
                    example: BTCUSD
                    description: 标的交易对
                  st:
                    type: integer
                    example: 1
                    description: (迁移后新增) Symbol 类型:1 = UM,2 = CM
              example:
                e: bookTicker
                u: 17242169
                s: BTCUSD_200626
                b: '9548.1'
                B: '52'
                a: '9548.5'
                A: '11'
                T: 1591268628155
                E: 1591268628166
                ps: BTCUSD
                st: 1
        Combined Stream:
          description: Stream payload with stream name.
          content:
            application/json:
              schema:
                type: object
                properties:
                  stream:
                    type: string
                    example: '!bookTicker'
                  data:
                    type: object
                    properties:
                      e:
                        type: string
                        example: bookTicker
                        enum:
                          - bookTicker
                        description: 事件类型
                      u:
                        type: integer
                        example: 17242169
                        format: int64
                        description: 更新ID
                      s:
                        type: string
                        example: BTCUSD_200626
                        description: 交易对
                      b:
                        type: string
                        example: '9548.1'
                        description: 买单最优挂单价格
                      B:
                        type: string
                        example: '52'
                        description: 买单最优挂单数量
                      a:
                        type: string
                        example: '9548.5'
                        description: 卖单最优挂单价格
                      A:
                        type: string
                        example: '11'
                        description: 卖单最优挂单数量
                      T:
                        type: integer
                        example: 1591268628155
                        format: int64
                        description: 撮合时间
                      E:
                        type: integer
                        example: 1591268628166
                        format: int64
                        description: 事件时间
                      ps:
                        type: string
                        example: BTCUSD
                        description: 标的交易对
                      st:
                        type: integer
                        example: 1
                        description: (迁移后新增) Symbol 类型:1 = UM,2 = CM
                required:
                  - stream
                  - data
                additionalProperties: false
              example:
                stream: '!bookTicker'
                data:
                  e: bookTicker
                  u: 17242169
                  s: BTCUSD_200626
                  b: '9548.1'
                  B: '52'
                  a: '9548.5'
                  A: '11'
                  T: 1591268628155
                  E: 1591268628166
                  ps: BTCUSD
                  st: 1
  /!forceOrder@arr:
    post:
      summary: 全市场强平订单
      description: |-
        全市场强平订单快照流推送全市场所有交易对的强平订单信息。每个交易对在 1000ms 内只会推送最新的一笔强平订单作为快照，如果 1000ms 内没有发生强平，则不会推送任何流。

        > **迁移后**,此 stream 推送合并的 UM + CM universe(`fstream` 与 `dstream` 都可订阅);payload 末尾新增 `st` 字段(`1` = UM,`2` = CM)。
      operationId: allMarketLiquidationOrderStreams
      externalDocs:
        url: https://developers.binance.com/en/docs/catalog/core-trading-derivatives-trading-coin-m-futures/api/ws-streams/~#all-market-liquidation-order-streams
      x-connectors-examples:
        ts: https://raw.githubusercontent.com/binance/binance-connector-js/master/clients/derivatives-trading-coin-futures/examples/websocket-streams//allMarketLiquidationOrderStreams.ts
        rust: https://raw.githubusercontent.com/binance/binance-connector-rust/main/examples/derivatives_trading_coin_futures/websocket_streams//all_market_liquidation_order_streams.rs
        python: https://raw.githubusercontent.com/binance/binance-connector-python/master/clients/derivatives_trading_coin_futures/examples/websocket_streams//all_market_liquidation_order_streams.py
        java: https://raw.githubusercontent.com/binance/binance-connector-java/master/examples/derivatives-trading-coin-futures/src/main/java/com/binance/connector/client/derivatives_trading_coin_futures/websocket/stream/websocketmarketstreams//AllMarketLiquidationOrderStreamsExample.java
        go: https://raw.githubusercontent.com/binance/binance-connector-go/main/clients/derivativestradingcoinfutures/examples/websocketstreams/WebsocketMarketStreamsAPI//AllMarketLiquidationOrderStreams/AllMarketLiquidationOrderStreams.go
      x-update-speed: 1000ms
      parameters:
        - name: id
          in: query
          required: false
          schema:
            type: string
            example: e9d6b4349871b40611412680b3445fac
          description: 唯一的 WebSocket 请求 ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                method:
                  type: string
                  description: WebSocket 数据流方法名称。
                  enum:
                    - SUBSCRIBE
                  example: SUBSCRIBE
                params:
                  type: array
                  items:
                    type: string
                  description: 要订阅的数据流列表。
                  example:
                    - '!forceOrder@arr'
                id:
                  type: string
                  example: e9d6b4349871b40611412680b3445fac
                  description: 唯一的 WebSocket 请求 ID。
              required:
                - method
                - params
                - id
              additionalProperties: false
            example:
              method: SUBSCRIBE
              params:
                - '!forceOrder@arr'
              id: e9d6b4349871b40611412680b3445fac
      responses:
        Raw Stream:
          description: 全市场强平订单流
          content:
            application/json:
              schema:
                type: object
                properties:
                  e:
                    type: string
                    example: forceOrder
                    enum:
                      - forceOrder
                    description: 事件类型
                  E:
                    type: integer
                    example: 1591154240950
                    format: int64
                    description: 事件时间
                  o:
                    type: object
                    properties:
                      s:
                        type: string
                        example: BTCUSD_200925
                        description: 交易对
                      ps:
                        type: string
                        example: BTCUSD
                        description: 标的交易对
                      S:
                        type: string
                        example: SELL
                        description: 订单方向
                      o:
                        type: string
                        example: LIMIT
                        description: 订单类型
                      f:
                        type: string
                        example: IOC
                        description: 有效方式
                      q:
                        type: string
                        example: '1'
                        description: 订单数量
                      p:
                        type: string
                        example: '9425.5'
                        description: 订单价格
                      ap:
                        type: string
                        example: '9496.5'
                        description: 平均价格
                      X:
                        type: string
                        example: FILLED
                        description: 订单状态
                      l:
                        type: string
                        example: '1'
                        description: 订单最近成交量
                      z:
                        type: string
                        example: '1'
                        description: 订单累计成交量
                      T:
                        type: integer
                        example: 1591154240949
                        format: int64
                        description: 交易时间
                    description: 订单类型
                  st:
                    type: integer
                    example: 1
                    description: (迁移后新增) Symbol 类型:1 = UM,2 = CM
              example:
                e: forceOrder
                E: 1591154240950
                o:
                  s: BTCUSD_200925
                  ps: BTCUSD
                  S: SELL
                  o: LIMIT
                  f: IOC
                  q: '1'
                  p: '9425.5'
                  ap: '9496.5'
                  X: FILLED
                  l: '1'
                  z: '1'
                  T: 1591154240949
                st: 1
        Combined Stream:
          description: Stream payload with stream name.
          content:
            application/json:
              schema:
                type: object
                properties:
                  stream:
                    type: string
                    example: '!forceOrder@arr'
                  data:
                    type: object
                    properties:
                      e:
                        type: string
                        example: forceOrder
                        enum:
                          - forceOrder
                        description: 事件类型
                      E:
                        type: integer
                        example: 1591154240950
                        format: int64
                        description: 事件时间
                      o:
                        type: object
                        properties:
                          s:
                            type: string
                            example: BTCUSD_200925
                            description: 交易对
                          ps:
                            type: string
                            example: BTCUSD
                            description: 标的交易对
                          S:
                            type: string
                            example: SELL
                            description: 订单方向
                          o:
                            type: string
                            example: LIMIT
                            description: 订单类型
                          f:
                            type: string
                            example: IOC
                            description: 有效方式
                          q:
                            type: string
                            example: '1'
                            description: 订单数量
                          p:
                            type: string
                            example: '9425.5'
                            description: 订单价格
                          ap:
                            type: string
                            example: '9496.5'
                            description: 平均价格
                          X:
                            type: string
                            example: FILLED
                            description: 订单状态
                          l:
                            type: string
                            example: '1'
                            description: 订单最近成交量
                          z:
                            type: string
                            example: '1'
                            description: 订单累计成交量
                          T:
                            type: integer
                            example: 1591154240949
                            format: int64
                            description: 交易时间
                        description: 订单类型
                      st:
                        type: integer
                        example: 1
                        description: (迁移后新增) Symbol 类型:1 = UM,2 = CM
                required:
                  - stream
                  - data
                additionalProperties: false
              example:
                stream: '!forceOrder@arr'
                data:
                  e: forceOrder
                  E: 1591154240950
                  o:
                    s: BTCUSD_200925
                    ps: BTCUSD
                    S: SELL
                    o: LIMIT
                    f: IOC
                    q: '1'
                    p: '9425.5'
                    ap: '9496.5'
                    X: FILLED
                    l: '1'
                    z: '1'
                    T: 1591154240949
                  st: 1
  /!miniTicker@arr:
    post:
      summary: 全市场的精简Ticker
      description: |-
        所有交易对的24小时滚动窗口精简Ticker统计。这些不是UTC日的统计数据，而是从请求时间到24小时前的24小时滚动窗口。请注意，只有发生变化的Ticker才会出现在数组中。

        > **迁移后**,此 stream 推送合并的 UM + CM universe(`fstream` 与 `dstream` 都可订阅);payload 末尾新增 `st` 字段(`1` = UM,`2` = CM)。
