                  description: 唯一的 WebSocket 请求 ID。
              required:
                - method
                - params
                - id
              additionalProperties: false
            example:
              method: SUBSCRIBE
              params:
                - btcusdt@depth@100ms
              id: e9d6b4349871b40611412680b3445fac
      responses:
        Raw Stream:
          description: 增量深度流
          content:
            application/json:
              schema:
                type: object
                properties:
                  e:
                    type: string
                    example: depthUpdate
                    enum:
                      - depthUpdate
                    description: 事件类型
                  E:
                    type: integer
                    example: 1591270260907
                    format: int64
                    description: 事件时间
