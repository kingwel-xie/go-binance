          description: 创建Special Key
          content:
            application/json:
              schema:
                type: object
                properties:
                  apiKey:
                    type: string
                    example: npOzOAeLVgr2TuxWfNo43AaPWpBbJEoKezh1o8mSQb6ryE2odE11A4AoVlJbQoGx
                    description: API密钥.
                  secretKey:
