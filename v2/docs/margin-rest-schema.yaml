  /sapi/v1/margin/order/oto:
    post:
      summary: 杠杆账户OTO下单 (TRADE)
      description: |-
        发送一个新的 OTO 订单。

        - 一个 OTO 订单（One-Triggers-the-Other）是一个包含了两个订单的订单列表.

        - 第一个订单被称为**生效订单**，必须为 `LIMIT` 或 `LIMIT_MAKER` 类型的订单。最初，订单簿上只有生效订单。

        - 第二个订单被称为**待处理订单**。它可以是任何订单类型，但不包括使用参数 `quoteOrderQty` 的 `MARKET`
        订单。只有当生效订单**完全成交**时，待处理订单才会被自动下单。

        - 如果生效订单或者待处理订单中的任意一个被单独取消，订单列表中剩余的那个订单也会被随之取消或过期。

        - 如果生效订单在下订单列表后**立即完全成交**，则可能会得到订单响应。其中，生效订单的状态为 `FILLED` ，但待处理订单的状态为
        `PENDING_NEW`。针对这类情况，如果需要检查当前状态，您可以查询相关的待处理订单。

        - `OTO` 订单将**2 个订单**添加到未成交订单计数，`EXCHANGE_MAX_NUM_ORDERS` 过滤器和
        `MAX_NUM_ORDERS` 过滤器中。
      tags:
        - trade
      operationId: marginAccountNewOto
      externalDocs:
        url: https://developers.binance.com/en/docs/catalog/core-trading-margin-trading/api/rest-api/trade#margin-account-new-oto
      x-connectors-examples:
        ts: https://raw.githubusercontent.com/binance/binance-connector-js/master/clients/margin-trading/examples/rest-api/TradeApi/marginAccountNewOto.ts
        rust: https://raw.githubusercontent.com/binance/binance-connector-rust/main/examples/margin_trading/rest_api/trade_api/margin_account_new_oto.rs
        python: https://raw.githubusercontent.com/binance/binance-connector-python/master/clients/margin_trading/examples/rest_api/Trade/margin_account_new_oto.py
        java: https://raw.githubusercontent.com/binance/binance-connector-java/master/examples/margin-trading/src/main/java/com/binance/connector/client/margin_trading/rest/trade/MarginAccountNewOtoExample.java
        go: https://raw.githubusercontent.com/binance/binance-connector-go/main/clients/margintrading/examples/restapi/TradeAPI/MarginAccountNewOto/MarginAccountNewOto.go
        php: https://raw.githubusercontent.com/binance/binance-connector-php/master/examples/margin-trading/trade/MarginAccountNewOtoExample.php
      x-security-type: TRADE
      x-signed: true
      x-weight: 6(UID) or 1500(UID) when sideEffectType is MARGIN_BUY or AUTO_BORROW_REPAY
      parameters:
        - name: X-MBX-APIKEY
          in: header
          required: true
          description: 访问此接口需要 API Key，并且必须在请求头中携带。关于如何创建 API Key，请参考：[https://www.binance.com/cn/support/faq/detail/360002502072](https://www.binance.com/cn/support/faq/detail/360002502072)。
          schema:
            type: string
            example: API_KEY
      x-parameters-notes: |-
        - autoRepayAtCancel 补充说明：在频繁下单撤单的情况下，为提高资金利用率，建议设置为 FALSE
        - 根据 pendingType 或 workingType 的不同值，对于某些可选参数有强制要求：

        | 类型 | 强制要求的参数 | 其他信息 |
        | --- | --- | --- |
        | `workingType` = `LIMIT` | `workingTimeInForce` | |
        | `pendingType` = `LIMIT` | `pendingPrice`， `pendingTimeInForce` | |
        | `pendingType` = `STOP_LOSS` 或 `TAKE_PROFIT` | `pendingStopPrice` 与/或 `pendingTrailingDelta` | |
        | `pendingType` = `STOP_LOSS_LIMIT` 或 `TAKE_PROFIT_LIMIT` | `pendingPrice`， `pendingStopPrice` 与/或 `pendingTrailingDelta`， `pendingTimeInForce` | |
        | 当传入 `pendingTrailingDelta` 时 | `pendingPrice` | |
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - symbol
                - workingType
                - workingSide
                - workingPrice
                - workingQuantity
                - workingIcebergQty
                - pendingType
                - pendingSide
                - pendingQuantity
                - timestamp
              properties:
                symbol:
                  type: string
                  example: BTCUSDT
                isIsolated:
                  type: string
                  example: 'FALSE'
                  default: 'FALSE'
                  enum:
                    - 'TRUE'
                    - 'FALSE'
                listClientOrderId:
                  type: string
                  example: '1'
                  description: Arbitrary unique ID among open 订单 lists. 若不传则自动生成。<br/>A new 订单 列表 with the same listClientOrderId is accepted only when the previous one is filled or completely expired.<br/>`listClientOrderId` is distinct from the `workingClientOrderId` and the `pendingClientOrderId`.
                newOrderRespType:
                  type: string
                  example: ACK
                  enum:
                    - ACK
                    - RESULT
                    - FULL
                  description: MARKET and 限制 订单 types 默认 to FULL, all other 订单 默认 to ACK.
                sideEffectType:
