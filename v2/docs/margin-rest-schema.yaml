openapi: 3.0.2
info:
  title: Margin REST API
  description: 访问账户信息、借入和偿还资产，并通过 Binance 杠杆进行交易。
  version: 1.0.0
  termsOfService: https://www.binance.com/en/terms
  contact:
    name: Binance API Support
    url: https://www.binance.com/en/support
x-product-type: rest-api
x-rate-limits-guide: products/margin-trading/general-info#访问限制
x-security-guide: products/margin-trading/general-info#请求鉴权类型
x-api-key-guide: https://www.binance.com/cn/support/faq/detail/360002502072
externalDocs:
  description: Margin docs
  url: https://developers.binance.com/en/docs/products/margin-trading/Introduction
tags:
  - name: account
    x-displayName: 账户接口
  - name: borrow-repay
    x-displayName: 借贷还款接口
  - name: market-data
    x-displayName: 行情接口
  - name: user-data-stream
    x-displayName: 杠杆风控信息推送
  - name: trade
    x-displayName: 交易接口
  - name: transfer
    x-displayName: 划转接口
servers:
  - url: https://api.binance.com
  - url: https://api-gcp.binance.com
  - url: https://api1.binance.com
  - url: https://api2.binance.com
  - url: https://api3.binance.com
  - url: https://api4.binance.com
paths:
  /sapi/v1/margin/max-leverage:
    post:
      summary: 调整全仓最大杠杆 (USER_DATA)
      description: 调整全仓最大杠杆倍数
      tags:
        - account
      operationId: adjustCrossMarginMaxLeverage
      externalDocs:
        url: https://developers.binance.com/en/docs/catalog/core-trading-margin-trading/api/rest-api/account#adjust-cross-margin-max-leverage
      x-connectors-examples:
        ts: https://raw.githubusercontent.com/binance/binance-connector-js/master/clients/margin-trading/examples/rest-api/AccountApi/adjustCrossMarginMaxLeverage.ts
        rust: https://raw.githubusercontent.com/binance/binance-connector-rust/main/examples/margin_trading/rest_api/account_api/adjust_cross_margin_max_leverage.rs
        python: https://raw.githubusercontent.com/binance/binance-connector-python/master/clients/margin_trading/examples/rest_api/Account/adjust_cross_margin_max_leverage.py
        java: https://raw.githubusercontent.com/binance/binance-connector-java/master/examples/margin-trading/src/main/java/com/binance/connector/client/margin_trading/rest/account/AdjustCrossMarginMaxLeverageExample.java
        go: https://raw.githubusercontent.com/binance/binance-connector-go/main/clients/margintrading/examples/restapi/AccountAPI/AdjustCrossMarginMaxLeverage/AdjustCrossMarginMaxLeverage.go
        php: https://raw.githubusercontent.com/binance/binance-connector-php/master/examples/margin-trading/account/AdjustCrossMarginMaxLeverageExample.php
      x-security-type: USER_DATA
      x-signed: true
      x-uid-weight: 3000, 1 times/min per IP
      parameters:
        - name: X-MBX-APIKEY
          in: header
          required: true
          description: 访问此接口需要 API Key，并且必须在请求头中携带。关于如何创建 API Key，请参考：[https://www.binance.com/cn/support/faq/detail/360002502072](https://www.binance.com/cn/support/faq/detail/360002502072)。
          schema:
            type: string
            example: API_KEY
      x-parameters-notes: '- 当前的风险率需要大于调整后的初始风险率，3x的初始风险率是1.5，5x的初始风险率是1.25，关于在Classic模式(3x, 5x) 和Pro模式(10x, 20x)之间的切换条件请参考[FAQ](https://www.binance.com/zh-CN/support/faq/%E5%A6%82%E4%BD%95%E5%9C%A8%E5%B8%81%E5%AE%89%E5%BC%80%E9%80%9A%E5%85%A8%E4%BB%93%E6%9D%A0%E6%9D%86%E4%B8%93%E4%B8%9A%E6%A8%A1%E5%BC%8F-e27786da05e743a694b8c625b3bc475d)。'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - maxLeverage
                - timestamp
              properties:
                maxLeverage:
                  type: integer
                  example: 3
                  format: int64
                  description: '只能调整3, 5 , 或者 10。举例: maxLeverage = 5 或者3是选择全仓Classic模式； maxLeverage=10 是选择切换成全仓 Pro 模式下的10倍杠杆 或者 20倍杠杆（在合规允许的情况下）。'
                timestamp:
                  type: integer
                  example: 1770736694138
                  format: int64
                  description: 用于请求签名的 Unix 时间戳，单位为毫秒. 该值必须反映客户端当前时间，并会在签名接口中由服务器进行校验.
      responses:
        '200':
          description: Adjust cross 杠杆 最大leverage
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                    description: 成功.
  /sapi/v1/margin/isolated/account:
    delete:
      summary: 杠杆逐仓账户停用 (TRADE)
      description: 停用特定交易对的杠杆逐仓账户。每个交易对 24 小时内仅可停用一次。
      tags:
        - account
      operationId: disableIsolatedMarginAccount
      externalDocs:
        url: https://developers.binance.com/en/docs/catalog/core-trading-margin-trading/api/rest-api/account#disable-isolated-margin-account
      x-connectors-examples:
        ts: https://raw.githubusercontent.com/binance/binance-connector-js/master/clients/margin-trading/examples/rest-api/AccountApi/disableIsolatedMarginAccount.ts
        rust: https://raw.githubusercontent.com/binance/binance-connector-rust/main/examples/margin_trading/rest_api/account_api/disable_isolated_margin_account.rs
        python: https://raw.githubusercontent.com/binance/binance-connector-python/master/clients/margin_trading/examples/rest_api/Account/disable_isolated_margin_account.py
        java: https://raw.githubusercontent.com/binance/binance-connector-java/master/examples/margin-trading/src/main/java/com/binance/connector/client/margin_trading/rest/account/DisableIsolatedMarginAccountExample.java
        go: https://raw.githubusercontent.com/binance/binance-connector-go/main/clients/margintrading/examples/restapi/AccountAPI/DisableIsolatedMarginAccount/DisableIsolatedMarginAccount.go
        php: https://raw.githubusercontent.com/binance/binance-connector-php/master/examples/margin-trading/account/DisableIsolatedMarginAccountExample.php
      x-security-type: TRADE
      x-signed: true
      x-uid-weight: 300
      parameters:
        - name: X-MBX-APIKEY
          in: header
          required: true
          description: 访问此接口需要 API Key，并且必须在请求头中携带。关于如何创建 API Key，请参考：[https://www.binance.com/cn/support/faq/detail/360002502072](https://www.binance.com/cn/support/faq/detail/360002502072)。
          schema:
            type: string
            example: API_KEY
        - name: symbol
          in: query
          required: true
          schema:
            type: string
            example: BTCUSDT
        - name: recvWindow
          in: query
          required: false
          schema:
            type: integer
            example: 5000
            format: int64
            maximum: 60000
        - name: timestamp
          in: query
          required: true
          schema:
            type: integer
            example: 1770736694138
            format: int64
          description: 用于请求签名的 Unix 时间戳，单位为毫秒. 该值必须反映客户端当前时间，并会在签名接口中由服务器进行校验.
      responses:
        '200':
          description: 禁用Isolated 杠杆 账户
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                    description: 成功.
                  symbol:
                    type: string
                    example: BTCUSDT
                    description: 交易对.
    post:
      summary: 杠杆逐仓账户启用 (TRADE)
      description: 启用特定交易对的杠杆逐仓账户（仅支持启用之前停用的账户）。
      tags:
        - account
      operationId: enableIsolatedMarginAccount
      externalDocs:
        url: https://developers.binance.com/en/docs/catalog/core-trading-margin-trading/api/rest-api/account#enable-isolated-margin-account
      x-connectors-examples:
        ts: https://raw.githubusercontent.com/binance/binance-connector-js/master/clients/margin-trading/examples/rest-api/AccountApi/enableIsolatedMarginAccount.ts
        rust: https://raw.githubusercontent.com/binance/binance-connector-rust/main/examples/margin_trading/rest_api/account_api/enable_isolated_margin_account.rs
        python: https://raw.githubusercontent.com/binance/binance-connector-python/master/clients/margin_trading/examples/rest_api/Account/enable_isolated_margin_account.py
        java: https://raw.githubusercontent.com/binance/binance-connector-java/master/examples/margin-trading/src/main/java/com/binance/connector/client/margin_trading/rest/account/EnableIsolatedMarginAccountExample.java
        go: https://raw.githubusercontent.com/binance/binance-connector-go/main/clients/margintrading/examples/restapi/AccountAPI/EnableIsolatedMarginAccount/EnableIsolatedMarginAccount.go
        php: https://raw.githubusercontent.com/binance/binance-connector-php/master/examples/margin-trading/account/EnableIsolatedMarginAccountExample.php
      x-security-type: TRADE
      x-signed: true
      x-uid-weight: 300
      parameters:
        - name: X-MBX-APIKEY
          in: header
          required: true
          description: 访问此接口需要 API Key，并且必须在请求头中携带。关于如何创建 API Key，请参考：[https://www.binance.com/cn/support/faq/detail/360002502072](https://www.binance.com/cn/support/faq/detail/360002502072)。
          schema:
            type: string
            example: API_KEY
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - symbol
                - timestamp
              properties:
                symbol:
                  type: string
                  example: BTCUSDT
                recvWindow:
                  type: integer
                  example: 5000
                  maximum: 60000
                  format: int64
                timestamp:
                  type: integer
                  example: 1770736694138
                  format: int64
                  description: 用于请求签名的 Unix 时间戳，单位为毫秒. 该值必须反映客户端当前时间，并会在签名接口中由服务器进行校验.
      responses:
        '200':
          description: 启用Isolated 杠杆 账户
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                    description: 成功.
                  symbol:
                    type: string
                    example: BTCUSDT
                    description: 交易对.
    get:
      summary: 查询杠杆逐仓账户信息 (USER_DATA)
      description: 查询杠杆逐仓账户信息
      tags:
        - account
      operationId: queryIsolatedMarginAccountInfo
      externalDocs:
        url: https://developers.binance.com/en/docs/catalog/core-trading-margin-trading/api/rest-api/account#query-isolated-margin-account-info
      x-connectors-examples:
        ts: https://raw.githubusercontent.com/binance/binance-connector-js/master/clients/margin-trading/examples/rest-api/AccountApi/queryIsolatedMarginAccountInfo.ts
        rust: https://raw.githubusercontent.com/binance/binance-connector-rust/main/examples/margin_trading/rest_api/account_api/query_isolated_margin_account_info.rs
        python: https://raw.githubusercontent.com/binance/binance-connector-python/master/clients/margin_trading/examples/rest_api/Account/query_isolated_margin_account_info.py
        java: https://raw.githubusercontent.com/binance/binance-connector-java/master/examples/margin-trading/src/main/java/com/binance/connector/client/margin_trading/rest/account/QueryIsolatedMarginAccountInfoExample.java
        go: https://raw.githubusercontent.com/binance/binance-connector-go/main/clients/margintrading/examples/restapi/AccountAPI/QueryIsolatedMarginAccountInfo/QueryIsolatedMarginAccountInfo.go
        php: https://raw.githubusercontent.com/binance/binance-connector-php/master/examples/margin-trading/account/QueryIsolatedMarginAccountInfoExample.php
      x-ip-weight: 10
      x-security-type: USER_DATA
      x-signed: true
      parameters:
        - name: X-MBX-APIKEY
          in: header
          required: true
          description: 访问此接口需要 API Key，并且必须在请求头中携带。关于如何创建 API Key，请参考：[https://www.binance.com/cn/support/faq/detail/360002502072](https://www.binance.com/cn/support/faq/detail/360002502072)。
          schema:
            type: string
            example: API_KEY
        - name: symbols
          in: query
          required: false
          schema:
            type: string
            example: BTCUSDT,BNBUSDT,ADAUSDT
            description: Max 5 交易对s can be sent; separated by ",".
            maximum: 5
        - name: recvWindow
          in: query
          required: false
          schema:
            type: integer
            example: 5000
            maximum: 60000
            format: int64
        - name: timestamp
          in: query
          required: true
          schema:
            type: integer
            example: 1770736694138
            format: int64
          description: 用于请求签名的 Unix 时间戳，单位为毫秒. 该值必须反映客户端当前时间，并会在签名接口中由服务器进行校验.
      x-parameters-notes: |-
        - 不传"symbols",返回所有杠杆逐仓资产
        - 传"symbols", 将只会返回指定symbol的杠杆逐仓资产
      responses:
        '200':
          description: Isolated 杠杆 账户 Info
          content:
            application/json:
              schema:
                type: object
                properties:
                  assets:
                    type: array
                    items:
                      type: object
                      properties:
                        baseAsset:
                          type: object
                          properties:
                            asset:
                              type: string
                              example: BTC
                              description: 资产.
                            borrowEnabled:
                              type: boolean
                              example: true
                              description: 借款 启用.
                            borrowed:
                              type: string
                              example: '0.00000000'
                              description: 借入.
                            free:
                              type: string
                              example: '0.00000000'
                              description: 可用.
                            interest:
                              type: string
                              example: '0.00000000'
                              description: 利息.
                            locked:
                              type: string
                              example: '0.00000000'
                              description: 冻结.
                            netAsset:
                              type: string
                              example: '0.00000000'
                              description: 净值 资产.
                            netAssetOfBtc:
                              type: string
                              example: '0.00000000'
                              description: 净值 资产 Of Btc.
                            repayEnabled:
                              type: boolean
                              example: true
                              description: 还款 启用.
                            totalAsset:
                              type: string
                              example: '0.00000000'
                              description: 总计 资产.
                          description: base 资产 object.
                        quoteAsset:
                          type: object
                          properties:
                            asset:
                              type: string
                              example: USDT
                              description: 资产.
                            borrowEnabled:
                              type: boolean
                              example: true
                              description: 借款 启用.
                            borrowed:
                              type: string
                              example: '0.00000000'
                              description: 借入.
                            free:
                              type: string
                              example: '0.00000000'
                              description: 可用.
                            interest:
                              type: string
                              example: '0.00000000'
                              description: 利息.
                            locked:
                              type: string
                              example: '0.00000000'
                              description: 冻结.
                            netAsset:
                              type: string
                              example: '0.00000000'
                              description: 净值 资产.
                            netAssetOfBtc:
                              type: string
                              example: '0.00000000'
                              description: 净值 资产 Of Btc.
                            repayEnabled:
                              type: boolean
                              example: true
                              description: 还款 启用.
                            totalAsset:
                              type: string
                              example: '0.00000000'
                              description: 总计 资产.
                          description: quote 资产 object.
                        symbol:
                          type: string
                          example: BTCUSDT
                          description: 交易对.
                        isolatedCreated:
                          type: boolean
                          example: true
                          description: 逐仓 Created.
                        enabled:
                          type: boolean
                          example: true
                          description: 账户是否启用，true-启用，false-停用
                        marginLevel:
                          type: string
                          example: '0.00000000'
                          description: 杠杆 Level.
                        marginLevelStatus:
                          type: string
                          example: EXCESSIVE
                          description: '"EXCESSIVE", "NORMAL", "杠杆_CALL", "PRE_LIQUIDATION", "FORCE_LIQUIDATION"'
                        marginRatio:
                          type: string
                          example: '0.00000000'
                          description: 杠杆 Ratio.
                        indexPrice:
                          type: string
                          example: '10000.00000000'
                          description: index 价格.
                        liquidatePrice:
                          type: string
                          example: '1000.00000000'
                          description: liquidate 价格.
                        liquidateRate:
                          type: string
                          example: '1.00000000'
                          description: liquidate 利率.
                        tradeEnabled:
                          type: boolean
                          example: true
                          description: 交易 启用.
                    description: assets 列表.
                  totalAssetOfBtc:
                    type: string
                    example: '0.00000000'
                    description: 总计 资产 Of Btc.
                  totalLiabilityOfBtc:
                    type: string
                    example: '0.00000000'
                    description: 总计 Liability Of Btc.
                  totalNetAssetOfBtc:
                    type: string
                    example: '0.00000000'
                    description: 总计 净值 资产 Of Btc.
  /sapi/v1/bnbBurn:
    get:
      summary: 获取BNB抵扣开关状态 (USER_DATA)
