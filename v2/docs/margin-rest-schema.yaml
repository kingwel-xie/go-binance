        - 根据 pendingAboveType、pendingBelowType 或 workingType 的不同值，对于某些可选参数有强制要求 | 类型                                 | 强制要求的参数                                               | 其他信息 | | ------------------------------------ | ------------------------------------------------------------ | -------- | | `workingType` = `LIMIT`              | `workingTimeInForce`                                         |          | | `pendingAboveType`= `LIMIT_MAKER`    | `pendingAbovePrice`                                          |          | | `pendingAboveType`= `STOP_LOSS`      | `pendingAboveStopPrice` 与/或 `pendingAboveTrailingDelta`    |          | | `pendingAboveType`=`STOP_LOSS_LIMIT` | `pendingAbovePrice`， `pendingAboveStopPrice` 与/或 `pendingAboveTrailingDelta`， `pendingAboveTimeInForce` |          | | `pendingBelowType`= `LIMIT_MAKER`    | `pendingBelowPrice`                                          |          | | `pendingBelowType`= `STOP_LOSS`      | `pendingBelowStopPrice` 与/或 `pendingBelowTrailingDelta`    |          | | `pendingBelowType`=`STOP_LOSS_LIMIT` | `pendingBelowPrice`， `pendingBelowStopPrice` 与/或 `pendingBelowTrailingDelta`， `pendingBelowTimeInForce` |          | | 当传入 `pendingAboveTrailingDelta` 时 | `pendingAbovePrice` |          | | 当传入 `pendingBelowTrailingDelta` 时 | `pendingBelowPrice` |          |
