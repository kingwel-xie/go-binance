        go: https://raw.githubusercontent.com/binance/binance-connector-go/main/clients/margintrading/examples/restapi/TradeAPI/MarginAccountNewOtoco/MarginAccountNewOtoco.go
        php: https://raw.githubusercontent.com/binance/binance-connector-php/master/examples/margin-trading/trade/MarginAccountNewOtocoExample.php
