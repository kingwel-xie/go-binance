        go: https://raw.githubusercontent.com/binance/binance-connector-go/main/clients/margintrading/examples/restapi/AccountAPI/GetBnbBurnStatus/GetBnbBurnStatus.go
        php: https://raw.githubusercontent.com/binance/binance-connector-php/master/examples/margin-trading/account/GetBnbBurnStatusExample.php
