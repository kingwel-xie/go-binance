  /sapi/v1/margin/tradeCoeff:
    get:
      summary: 查询Margin账户信息汇总 (USER_DATA)
      description: 获取用户个人杠杆账户信息汇总
      tags:
        - account
      operationId: getSummaryOfMarginAccount
      externalDocs:
        url: https://developers.binance.com/en/docs/catalog/core-trading-margin-trading/api/rest-api/account#get-summary-of-margin-account
      x-connectors-examples:
        ts: https://raw.githubusercontent.com/binance/binance-connector-js/master/clients/margin-trading/examples/rest-api/AccountApi/getSummaryOfMarginAccount.ts
        rust: https://raw.githubusercontent.com/binance/binance-connector-rust/main/examples/margin_trading/rest_api/account_api/get_summary_of_margin_account.rs
        python: https://raw.githubusercontent.com/binance/binance-connector-python/master/clients/margin_trading/examples/rest_api/Account/get_summary_of_margin_account.py
        java: https://raw.githubusercontent.com/binance/binance-connector-java/master/examples/margin-trading/src/main/java/com/binance/connector/client/margin_trading/rest/account/GetSummaryOfMarginAccountExample.java
        go: https://raw.githubusercontent.com/binance/binance-connector-go/main/clients/margintrading/examples/restapi/AccountAPI/GetSummaryOfMarginAccount/GetSummaryOfMarginAccount.go
        php: https://raw.githubusercontent.com/binance/binance-connector-php/master/examples/margin-trading/account/GetSummaryOfMarginAccountExample.php
      x-ip-weight: 10
      x-security-type: USER_DATA
      x-signed: true
      parameters:
        - name: X-MBX-APIKEY
          in: header
          required: true
          description: 访问此接口需要 API Key，并且必须在请求头中携带。关于如何创建 API Key，请参考：[https://www.binance.com/cn/support/faq/detail/360002502072](https://www.binance.com/cn/support/faq/detail/360002502072)。
          schema:
            type: string
            example: API_KEY
        - name: recvWindow
          in: query
          required: false
          schema:
            type: integer
            example: 5000
            maximum: 60000
            format: int64
        - name: timestamp
          in: query
          required: true
          schema:
            type: integer
            example: 1770736694138
            format: int64
          description: 用于请求签名的 Unix 时间戳，单位为毫秒. 该值必须反映客户端当前时间，并会在签名接口中由服务器进行校验.
      responses:
        '200':
          description: 获取Summary of 杠杆 账户
          content:
            application/json:
              schema:
                type: object
                properties:
                  normalBar:
                    type: string
                    example: '1.5'
                    description: 字段说明：normal Bar.
                  marginCallBar:
