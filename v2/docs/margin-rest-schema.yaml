            example: API_KEY
      x-parameters-notes: |-
        - `-3045 INSUFFICIENT_INVENTORY`：系统库存资产数量低于申请借贷金额，或库存严重不足（无论借贷金额大小均拒绝）。建议密切关注系统资产状况并调整借贷策略。
        - `-3006 EXCEED_MAX_BORROWABLE`：借款请求超过当前最大可借金额。可调用 `GET /sapi/v1/margin/maxBorrowable` 查询后调整请求。
        - `-3012 ASSET_ADMIN_BAN_BORROW`：该资产当前不支持借贷。可调用 `GET /sapi/v1/margin/allAssets` 查询资产借贷可用情况。
        - `-3015 REPAY_EXCEED_LIABILITY`：对应两种场景 —— (1) 还款金额超过未还借款；(2) 还款后剩余未还债务低于币安规定的最低限额。请据此调整还款金额。
        - `-3007 HAS_PENDING_TRANSACTION`：账户已有借款/还款交易在处理中。系统按提交顺序处理所有资产的请求，进行中的请求会短暂限制后续请求；一般处理耗时约 100 毫秒，建议请求间隔至少 100 毫秒。自动还款订单也可能因同样原因静默失败，建议在自动还款执行后核查未还余额。
