        go: https://raw.githubusercontent.com/binance/binance-connector-go/main/clients/margintrading/examples/restapi/TradeAPI/CreateSpecialKey/CreateSpecialKey.go
        php: https://raw.githubusercontent.com/binance/binance-connector-php/master/examples/margin-trading/trade/CreateSpecialKeyExample.php
      x-security-type: TRADE
      x-signed: true
      x-uid-weight: 1
      parameters:
        - name: X-MBX-APIKEY
          in: header
          required: true
          description: 访问此接口需要 API Key，并且必须在请求头中携带。关于如何创建 API Key，请参考：[https://www.binance.com/cn/support/faq/detail/360002502072](https://www.binance.com/cn/support/faq/detail/360002502072)。
          schema:
            type: string
            example: API_KEY
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - apiName
                - timestamp
              properties:
                apiName:
                  type: string
                  example: apiName
                symbol:
                  type: string
                  example: BTCUSDT
                ip:
                  type: string
                  example: 69.210.67.14,69.210.67.15
                  description: Can be added in batches, separated by commas. 最大 30 用于 an API Key
                publicKey:
                  type: string
                  example: publicKey
                  description: 1. If public密钥 is inputted it will create an RSA or Ed25519 密钥. 2. Need to be encoded to URL-encoded format
                permissionMode:
                  type: string
                  example: READ
                  default: TRADE
                  enum:
                    - TRADE
                    - READ
                  description: This parameter is only for the Ed25519 API key, and does not effact for other encryption methods. The value can be 交易 (交易 for all permissions) or READ (READ for USER_DATA, FIX_API_READ_ONLY). The 默认 value is 交易.
                recvWindow:
                  type: integer
                  example: 5000
                  format: int64
                  maximum: 60000
                timestamp:
                  type: integer
                  example: 1770736694138
