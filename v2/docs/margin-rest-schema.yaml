                    - MARGIN_BUY
                    - AUTO_BORROW_REPAY
                selfTradePreventionMode:
                  type: string
                  example: NONE
                  enum:
                    - EXPIRE_TAKER
                    - EXPIRE_MAKER
                    - EXPIRE_BOTH
                    - NONE
                autoRepayAtCancel:
                  type: boolean
                  example: true
                  description: 仅在相关订单生效时，true 表示撤单后需归还订单产生的负债。
                  default: true
                workingType:
                  type: string
